<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="Movie Reviews By Poorna">
  <title>Cini Cafe | Movie Reviews By Poorna</title>
  <link rel="preconnect" href="https://assets.moviereviewbypoorna.com" crossorigin>
  <link rel="preload" as="image" href="https://assets.moviereviewbypoorna.com/ui/pages/cine-cafe/v3/mobile/Cini_Cafe_Master_RT.avif" fetchpriority="high">
  <link rel="stylesheet" href="/assets/css/cine-cafe.css?v=20260902-v3-1">
</head>
<body>
  <main class="cine-cafe-page" aria-label="Cini Cafe review search">
    <section class="cine-cafe-stage" id="cineCafeStage" aria-busy="true">
      <a class="hotspot hotspot-menu" href="/" aria-label="Back to Lounge"></a>
      <button class="hotspot hotspot-search" id="headerSearch" type="button" aria-label="Focus search"></button>

      <form class="search-overlay" id="searchForm" role="search">
        <label class="sr-only" for="cineSearch">Search reviews</label>
        <input id="cineSearch" type="search" autocomplete="off" placeholder="Search movies, actors, directors…">
      </form>

      <section class="filter-overlay" aria-label="Review filters">
        <label class="filter-control filter-language">
          <span class="sr-only">Language</span>
          <select id="languageFilter" aria-label="Filter by language">
            <option value="">Language</option>
          </select>
        </label>
        <label class="filter-control filter-year">
          <span class="sr-only">Year</span>
          <select id="yearFilter" aria-label="Filter by year">
            <option value="">Year</option>
          </select>
        </label>
        <label class="filter-control filter-sort">
          <span class="sr-only">Sort by</span>
          <select id="sortFilter" aria-label="Sort reviews">
            <option value="latest">Sort By</option>
            <option value="oldest">Oldest</option>
            <option value="title-asc">Title A–Z</option>
            <option value="title-desc">Title Z–A</option>
          </select>
        </label>
        <button class="filter-clear" id="clearFilters" type="button" aria-label="Clear filters"></button>
      </section>

      <p class="result-count" id="resultCount" aria-live="polite">
        <span id="resultRange"></span>
        <span id="resultTotal"></span>
      </p>

      <section class="results-layer" id="resultsLayer" aria-label="Review results"></section>
      <nav class="pagination-layer" id="pagination" aria-label="Review pages"></nav>
      <p class="empty-state" id="emptyState" hidden>No reviews match your search.</p>

      <a class="bottom-hotspot bottom-lounge" href="/" aria-label="Lounge"></a>
      <a class="bottom-hotspot bottom-cafe" href="/cine-cafe/" aria-label="Cini Cafe" aria-current="page"></a>
    </section>
  </main>

  <script type="module" src="/assets/js/cine-cafe.js?v=20260902-v3-1"></script>
</body>
</html>
