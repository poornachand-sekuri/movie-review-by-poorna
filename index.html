<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="Movie Reviews By Poorna — Fresh Take">
  <title>Movie Reviews By Poorna — Fresh Take</title>
  <link rel="stylesheet" href="/assets/css/site.css">
</head>
<body>
  <div id="app" class="app-shell" aria-busy="true">
    <header class="brand-header" id="brandHeader">
      <img id="brandArtwork" class="brand-artwork" alt="Movie Reviews By Poorna">
      <button class="header-hotspot header-menu" id="menuButton" type="button" aria-label="Open menu"></button>
      <button class="header-hotspot header-search" id="searchButton" type="button" aria-label="Search reviews"></button>
    </header>

    <main id="content" class="content-page">
      <section class="loading-card" id="loadingCard" aria-live="polite">Loading review…</section>
    </main>
  </div>

  <aside class="drawer" id="menuDrawer" aria-hidden="true">
    <button class="drawer-close" id="menuClose" type="button" aria-label="Close menu">×</button>
    <nav class="drawer-nav" aria-label="Primary">
      <a href="/">Home</a>
      <button type="button" data-action="browse">Reviews</button>
      <button type="button" data-action="languages">Languages</button>
      <button type="button" data-action="search">Search</button>
    </nav>
  </aside>
  <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>

  <dialog class="search-dialog" id="searchDialog">
    <form method="dialog" class="search-shell" id="searchForm">
      <div class="search-head">
        <label for="searchInput">Search reviews</label>
        <button type="submit" value="cancel" aria-label="Close search">×</button>
      </div>
      <input id="searchInput" type="search" autocomplete="off" placeholder="Movie title…">
      <div id="searchResults" class="search-results" role="list"></div>
    </form>
  </dialog>

  <template id="reviewTemplate">
    <article class="review-page">
      <section class="clapboard" aria-label="Movie details">
        <img class="clapboard-top" alt="" aria-hidden="true">
        <div class="clapboard-body">
          <div class="clapboard-bg" aria-hidden="true"></div>
          <div class="clapboard-content">
            <div class="poster-frame">
              <img class="poster-frame-art" alt="" aria-hidden="true">
              <div class="poster-safe-zone"><img class="movie-poster" alt=""></div>
            </div>
            <div class="movie-meta">
              <h1 class="movie-title"></h1>
              <dl class="meta-list">
                <div><dt>Watched in</dt><dd class="movie-language"></dd></div>
                <div><dt>Release date</dt><dd class="movie-release"></dd></div>
                <div><dt>Cast &amp; Crew</dt><dd class="movie-cast"></dd></div>
                <div><dt>Rating</dt><dd class="movie-rating"></dd></div>
                <div><dt>My POV</dt><dd class="movie-pov"></dd></div>
              </dl>
            </div>
          </div>
        </div>

        <section class="reaction-panel" aria-label="Review reactions">
          <div class="reaction-bg" aria-hidden="true"></div>
          <h2>Do you like this review?</h2>
          <div class="reaction-actions">
            <button type="button" class="reaction-button" data-vote="like">
              <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M11.5 27H6a2 2 0 0 1-2-2V14a2 2 0 0 1 2-2h5.5V27Zm2-15.6 4.2-6.2c.7-1 2.3-.6 2.4.6l.3 4.2H26a3 3 0 0 1 2.9 3.7l-2.6 10A4 4 0 0 1 22.4 27h-8.9V11.4Z"/></svg>
              <span class="reaction-label">Thumbs Up</span>
              <strong class="like-count">0</strong>
            </button>
            <button type="button" class="reaction-button" data-vote="dislike">
              <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M20.5 5H26a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2h-5.5V5Zm-2 15.6-4.2 6.2c-.7 1-2.3.6-2.4-.6l-.3-4.2H6a3 3 0 0 1-2.9-3.7l2.6-10A4 4 0 0 1 9.6 5h8.9v15.6Z"/></svg>
              <span class="reaction-label">Thumbs Down</span>
              <strong class="dislike-count">0</strong>
            </button>
          </div>
        </section>
      </section>

      <section class="theater" aria-label="My Review">
        <img class="theater-top" alt="" aria-hidden="true">
        <div class="theater-middle">
          <article class="review-body"></article>
        </div>
        <img class="theater-bottom" alt="" aria-hidden="true">
      </section>

      <section class="related-section" aria-label="Related Reviews">
        <img class="related-header" alt="Related Reviews">
        <div class="related-scroll" tabindex="0" aria-label="Related reviews. Swipe horizontally to browse.">
          <div class="related-reel">
            <div class="related-grid"></div>
          </div>
        </div>
      </section>

      <section class="comments-section" aria-label="Share your opinion">
        <img class="comments-header" alt="Share Your Opinion">
        <div class="comments-shell">
          <div class="comments-bg" aria-hidden="true"></div>
          <div class="comments-content">
            <section class="recent-comments">
              <h2>Recent Comments</h2>
              <div class="comment-list"></div>
            </section>
            <section class="add-comment">
              <h2>Add Your Comment</h2>
              <form class="comment-form">
                <label>Name<input name="name" required maxlength="60"></label>
                <label>Email<input name="email" type="email" required maxlength="120"></label>
                <label>Comment<textarea name="comment" required maxlength="1200" rows="5"></textarea></label>
                <div class="comment-actions"><button type="submit">Submit Comment</button></div>
                <p class="comment-status" role="status"></p>
              </form>
            </section>
          </div>
        </div>
      </section>
    </article>
  </template>

  <script type="module" src="/assets/js/app.js"></script>
</body>
</html>
