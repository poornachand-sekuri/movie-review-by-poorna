<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="Movie Reviews By Poorna">
  <title>Movie Reviews By Poorna</title>
  <link rel="preconnect" href="https://assets.moviereviewbypoorna.com" crossorigin>
  <link rel="stylesheet" href="/assets/css/site.css">
  <link rel="stylesheet" href="/assets/css/navigation.css?v=20260902-v3-canonical-1">
</head>
<body>
  <div id="app" class="app-shell" aria-busy="true">
    <main id="content" class="content-page">
      <section class="loading-card" id="loadingCard" aria-live="polite">Loading review…</section>
    </main>
  </div>

  <!-- Content V3 still uses this shared search dialog. Home routes its search
       artwork directly to Cini Cafe, so there is no Home search runtime here. -->
  <dialog class="search-dialog" id="searchDialog">
    <div class="search-shell">
      <div class="search-head">
        <label for="searchInput">Search reviews</label>
        <button type="button" id="searchClose" aria-label="Close search">×</button>
      </div>
      <input id="searchInput" type="search" autocomplete="off" placeholder="Movie title or language…">
      <div id="searchResults" class="search-results" role="list"></div>
    </div>
  </dialog>

  <!-- Kept as inert compatibility nodes for the base Content renderer. The
       canonical Content runtime owns the hamburger action and never opens them. -->
  <aside class="drawer" id="menuDrawer" aria-hidden="true" hidden></aside>
  <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>

  <script type="module" src="/assets/js/bootstrap-home-v3.js?v=20260902-v3-canonical-1"></script>
</body>
</html>
