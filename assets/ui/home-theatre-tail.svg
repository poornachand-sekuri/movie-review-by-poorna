      <stop offset=".62" stop-color="#350207" stop-opacity=".45"/>
      <stop offset="1" stop-color="#050303" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="curtainR" x1="1" y1=".35" x2="0" y2=".55">
      <stop offset="0" stop-color="#250003" stop-opacity=".98"/>
      <stop offset=".28" stop-color="#780915" stop-opacity=".72"/>
      <stop offset=".62" stop-color="#350207" stop-opacity=".45"/>
      <stop offset="1" stop-color="#050303" stop-opacity="0"/>
