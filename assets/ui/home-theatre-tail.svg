      <stop offset=".66" stop-color="#4d250b" stop-opacity=".035"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="carpet" x1=".5" y1="0" x2=".5" y2="1">
