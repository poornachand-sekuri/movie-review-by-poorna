<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 420" preserveAspectRatio="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0906"/>
      <stop offset=".24" stop-color="#0a0504"/>
      <stop offset=".68" stop-color="#050303"/>
      <stop offset="1" stop-color="#020202"/>
    </linearGradient>
    <radialGradient id="topGlow" cx=".5" cy="0" r=".74">
      <stop offset="0" stop-color="#d8a34a" stop-opacity=".30"/>
