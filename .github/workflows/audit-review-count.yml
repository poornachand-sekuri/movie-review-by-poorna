name: Read-only D1 Review Count Audit

on:
  push:
    branches:
      - audit/read-only-review-count

permissions:
  contents: read

jobs:
  count-reviews:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Query ONLY review counts from production D1
        run: |
          npx wrangler d1 execute CONTENT_DB --remote --config wrangler.jsonc --command "SELECT COUNT(*) AS total_reviews, COALESCE(SUM(CASE WHEN status = 'published' THEN 1 ELSE 0 END), 0) AS published_reviews, COALESCE(SUM(CASE WHEN status = 'archived' THEN 1 ELSE 0 END), 0) AS archived_reviews, COALESCE(SUM(CASE WHEN status NOT IN ('published','archived') OR status IS NULL THEN 1 ELSE 0 END), 0) AS other_reviews FROM reviews;"
