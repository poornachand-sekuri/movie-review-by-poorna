name: Validate Movie Reviews By Poorna

on:
  pull_request:
  push:
    branches:
      - main
      - optimize/code-workflow-files

permissions:
  contents: read

concurrency:
  group: validate-static-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deployment tooling
        run: npm install --no-audit --no-fund

      - name: Check JavaScript syntax
        run: npm run check:js

      - name: Validate Cloudflare Worker bundle
        run: npx wrangler deploy --dry-run

      - name: Reject WordPress runtime dependencies
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const runtimeRoots = [
            'index.html',
            'cine-cafe',
            'admin',
            'assets',
            'src',
            'public/data',
            'package.json',
            'wrangler.jsonc'
          ];
          const blocked = [
            /wordpress/i,
            /wp-content/i,
            /wp-json/i,
            /wp-includes/i,
            /wp-admin/i,
            /wp-login/i,
            /xmlrpc\.php/i
          ];
          const textExtensions = new Set([
            '.html', '.css', '.js', '.json', '.jsonc', '.md', '.txt', '.xml'
          ]);

          function filesUnder(target) {
            if (!fs.existsSync(target)) return [];
            const stat = fs.statSync(target);
            if (stat.isFile()) return [target];
            return fs.readdirSync(target, { withFileTypes: true }).flatMap(entry => {
              const child = path.join(target, entry.name);
              return entry.isDirectory() ? filesUnder(child) : [child];
            });
          }

          const files = runtimeRoots.flatMap(filesUnder).filter(file => {
            const ext = path.extname(file).toLowerCase();
            return textExtensions.has(ext) || path.basename(file) === 'package.json';
          });

          const violations = [];
          for (const file of files) {
            const text = fs.readFileSync(file, 'utf8');
            for (const pattern of blocked) {
              if (pattern.test(text)) violations.push(`${file}: ${pattern}`);
            }
          }

          if (violations.length) {
            throw new Error(`Forbidden WordPress runtime reference(s):\n${violations.join('\n')}`);
          }

          console.log(`Checked ${files.length} runtime/data files: no WordPress references.`);
          NODE

      - name: Enforce R2 review image ownership
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const reviews = JSON.parse(fs.readFileSync('public/data/index.json', 'utf8'));
          const allowedHost = 'assets.moviereviewbypoorna.com';
          const requiredPosterPrefix = `https://${allowedHost}/reviews/`;
          const violations = [];

          function requireOwnedImage(raw, location) {
            if (!raw) return;
            let url;
            try {
              url = new URL(raw);
            } catch {
              violations.push(`${location}: invalid image URL ${raw}`);
              return;
            }
            if (url.protocol !== 'https:' || url.hostname !== allowedHost || !url.pathname.startsWith('/reviews/')) {
              violations.push(`${location}: image must be under ${requiredPosterPrefix}`);
            }
          }

          reviews.forEach((review, index) => {
            if (typeof review.m !== 'string' || !review.m.startsWith(requiredPosterPrefix)) {
              violations.push(`reviews[${index}].m: poster must live under ${requiredPosterPrefix}`);
            } else {
              requireOwnedImage(review.m, `reviews[${index}].m`);
            }

            const body = String(review.body || '');
            const imagePattern = /<img\b[^>]*\bsrc=["']([^"']+)["'][^>]*>/gi;
            for (const match of body.matchAll(imagePattern)) {
              requireOwnedImage(match[1], `reviews[${index}].body<img>`);
            }
          });

          if (violations.length) {
            throw new Error(`Review image asset violation(s):\n${violations.join('\n')}`);
          }

          const canonicalFrontendFiles = [
            'assets/js/home-v3.js',
            'assets/css/home-v3-stable.css',
            'assets/js/content-v3.js',
            'assets/css/content-v3-stable.css',
            'cine-cafe/index.html'
          ];
          const combined = canonicalFrontendFiles.map(file => fs.readFileSync(file, 'utf8')).join('\n');
          if (!combined.includes(`https://${allowedHost}/ui/pages/home/v3/mobile`)) {
            throw new Error('Home V3 artwork must use the owned R2 custom domain.');
          }
          if (!combined.includes(`https://${allowedHost}/ui/pages/content/v3`)) {
            throw new Error('Content V3 artwork must use the owned R2 custom domain.');
          }
          if (!combined.includes(`https://${allowedHost}/ui/pages/cine-cafe/v3/mobile`)) {
            throw new Error('Cini Cafe V3 artwork must use the owned R2 custom domain.');
          }

          const wrangler = fs.readFileSync('wrangler.jsonc', 'utf8');
          if (!wrangler.includes('"binding": "REVIEW_ASSETS"') || !wrangler.includes('"bucket_name": "movie-review-assets"')) {
            throw new Error('Admin review uploads must stay bound to movie-review-assets as REVIEW_ASSETS.');
          }
          if (!wrangler.includes('https://assets.moviereviewbypoorna.com')) {
            throw new Error('Admin review uploads must use the custom R2 public domain.');
          }

          console.log(`Validated ${reviews.length} reviews and canonical V3 R2 ownership.`);
          NODE

      - name: Reject obsolete frontend layers
        run: |
          node - <<'NODE'
          const fs = require('fs');

          const obsolete = [
            'assets/css/final-overrides.css',
            'assets/css/home-comments.css',
            'assets/css/home-mobile-polish.css',
            'assets/css/home-v3-adjustments.css',
            'assets/css/home-v3-nav-polish.css',
            'assets/css/home-v3-fidelity-fixes.css',
            'assets/css/home-v3-final-containment.css',
            'assets/css/home-v3-title-pov-21.css',
            'assets/js/home-comments.js',
            'assets/js/home-v3-adjustments.js',
            'assets/js/home-v3-nav-polish.js',
            'assets/js/home-v3-final-containment.js',
            'assets/css/content-v3-fidelity.css',
            'assets/css/content-v3-polish.css',
            'assets/css/content-v3-reaction-layout.css',
            'assets/css/content-v3-fidelity-fixes.css',
            'assets/css/content-v3-title-pov.css',
            'assets/js/content-v3-pov-fit.js',
            'assets/js/content-v3-polish.js',
            'assets/js/content-v3-title-marquee.js',
            'assets/css/cine-cafe-special.css',
            'assets/css/cine-cafe-v3-fix.css',
            'assets/css/cine-cafe-v3-pagination.css',
            'assets/css/cine-cafe-v3-polish.css',
            'assets/css/cine-cafe-v3-fidelity-fixes.css',
            'assets/js/cine-cafe-v3-polish.js',
            'assets/js/app.js',
            'assets/js/config.js',
            'assets/js/ui-patch.js',
            'assets/js/navigation.js'
          ];
          const existing = obsolete.filter(file => fs.existsSync(file));
          if (existing.length) {
            throw new Error(`Obsolete frontend layer(s) must stay deleted:\n${existing.join('\n')}`);
          }

          const entrypoints = [
            'index.html',
            'cine-cafe/index.html',
            'assets/js/bootstrap-home-v3.js'
          ].map(file => fs.readFileSync(file, 'utf8')).join('\n');
          const forbiddenRefs = [
            /content\/v2/i,
            /content-v2/i,
            /-fidelity/i,
            /-polish/i,
            /-final-containment/i,
            /home-v3-adjustments/i,
            /home-v3-nav-polish/i
          ];
          const matches = forbiddenRefs.filter(pattern => pattern.test(entrypoints));
          if (matches.length) {
            throw new Error(`Canonical entrypoints contain legacy frontend reference(s): ${matches.join(', ')}`);
          }
          console.log('Canonical V3 entrypoints contain no obsolete patch/version layers.');
          NODE

      - name: Validate preserved JSON data
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const reviews = JSON.parse(fs.readFileSync('public/data/index.json', 'utf8'));
          const castCrew = JSON.parse(fs.readFileSync('public/data/cast-crew.json', 'utf8'));
          const rules = JSON.parse(fs.readFileSync('public/data/related-review-rules.json', 'utf8'));

          if (!Array.isArray(reviews) || reviews.length !== 136) {
            throw new Error(`Expected 136 base reviews, found ${Array.isArray(reviews) ? reviews.length : 'non-array'}`);
          }
          if (!castCrew.records || typeof castCrew.records !== 'object') {
            throw new Error('cast-crew.json is missing records');
          }
          if (!Array.isArray(rules.tiers) || rules.max_results !== 4) {
            throw new Error('related-review-rules.json does not match the expected schema');
          }

          const missingCast = reviews.filter(review => !castCrew.records[review.s]).map(review => review.s);
          if (missingCast.length) {
            throw new Error(`Missing Cast & Crew records: ${missingCast.join(', ')}`);
          }

          console.log(`Validated ${reviews.length} base reviews and Cast & Crew joins.`);
          NODE

      - name: Verify required frontend files
        run: |
          test -f index.html
          test -f cine-cafe/index.html
          test -f admin/index.html
          test -f admin/admin.css
          test -f admin/admin.js
          test -f assets/css/site.css
          test -f assets/css/navigation.css
          test -f assets/css/home-v3.css
          test -f assets/css/home-v3-stable.css
          test -f assets/css/content-v3.css
          test -f assets/css/content-v3-stable.css
          test -f assets/css/cine-cafe.css
          test -f assets/css/cine-cafe-stable.css
          test -f assets/js/bootstrap-home-v3.js
          test -f assets/js/home-v3.js
          test -f assets/js/home-v3-runtime.js
          test -f assets/js/content-v3.js
          test -f assets/js/content-v3-runtime.js
          test -f assets/js/content-v3-asset-path.js
          test -f assets/js/live-reactions.js
          test -f assets/js/comments.js
          test -f assets/js/analytics.js
          test -f assets/js/cine-cafe-scale.js
          test -f assets/js/cine-cafe.js
          test -f assets/js/cine-cafe-runtime.js
          test -f docs/V3-RUNTIME-ARCHITECTURE.md
          test -f src/admin-console.js
          test -f src/analytics-store.js
          test -f src/worker.js
          test -f src/worker-entry.js
