name: Initialize Content Database

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type INITIALIZE to apply schema and import the live review catalogue.'
        required: true
        type: string
  push:
    branches:
      - cinema-rebuild
    paths:
      - '.github/init-content-db.trigger'

permissions:
  contents: read

concurrency:
  group: initialize-content-db
  cancel-in-progress: false

jobs:
  initialize:
    if: ${{ github.event_name == 'push' || inputs.confirm == 'INITIALIZE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_NAME: movie-review-by-poorna-content

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Cloudflare credentials are configured
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'Missing CLOUDFLARE_API_TOKEN repository secret.'; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID repository secret.'; exit 1; }
          npx wrangler d1 info "$DATABASE_NAME" --json > /tmp/db-info.json

      - name: Capture live source catalogue
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 2 \
            https://www.moviereviewbypoorna.com/data/index.json \
            --output /tmp/live-reviews.json

          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 2 \
            https://www.moviereviewbypoorna.com/data/cast-crew.json \
            --output /tmp/live-credits.json

          node scripts/build-legacy-seed.mjs \
            /tmp/live-reviews.json \
            /tmp/live-credits.json \
            /tmp/live-seed.sql

      - name: Apply versioned D1 schema migrations
        run: npx wrangler d1 migrations apply "$DATABASE_NAME" --remote

      - name: Inspect existing content state
        id: state
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute "$DATABASE_NAME" --remote --json \
            --command="SELECT COUNT(*) AS review_count FROM reviews;" \
            > /tmp/review-count.json

          node <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/review-count.json', 'utf8'));

          function findNumber(value, key) {
            if (Array.isArray(value)) {
              for (const item of value) {
                const found = findNumber(item, key);
                if (found !== null) return found;
              }
              return null;
            }
            if (value && typeof value === 'object') {
              if (Object.hasOwn(value, key) && Number.isFinite(Number(value[key]))) return Number(value[key]);
              for (const item of Object.values(value)) {
                const found = findNumber(item, key);
                if (found !== null) return found;
              }
            }
            return null;
          }

          const count = findNumber(payload, 'review_count');
          if (count === null) throw new Error('Could not read remote review count.');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `review_count=${count}\n`);
          console.log(`Remote database currently contains ${count} review(s).`);
          NODE

      - name: Import live catalogue into an empty database
        if: ${{ steps.state.outputs.review_count == '0' }}
        run: npx wrangler d1 execute "$DATABASE_NAME" --remote --yes --file=/tmp/live-seed.sql

      - name: Verify imported database against live source
        shell: bash
        run: |
          set -euo pipefail

          npx wrangler d1 execute "$DATABASE_NAME" --remote --json \
            --command="SELECT (SELECT COUNT(*) FROM reviews) AS reviews, (SELECT COUNT(*) FROM review_credits) AS credits, (SELECT COUNT(*) FROM review_gallery) AS gallery, (SELECT COUNT(*) FROM legacy_import_audit) AS audits, (SELECT COUNT(DISTINCT lower(slug)) FROM reviews) AS unique_slugs;" \
            > /tmp/remote-counts.json

          npx wrangler d1 execute "$DATABASE_NAME" --remote --json \
            --command="SELECT r.slug, a.source_sha256 FROM reviews r JOIN legacy_import_audit a ON a.review_id = r.id ORDER BY lower(r.slug);" \
            > /tmp/remote-hashes.json

          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');

          const reviews = JSON.parse(fs.readFileSync('/tmp/live-reviews.json', 'utf8'));
          const creditsDoc = JSON.parse(fs.readFileSync('/tmp/live-credits.json', 'utf8'));
          const countsPayload = JSON.parse(fs.readFileSync('/tmp/remote-counts.json', 'utf8'));
          const hashesPayload = JSON.parse(fs.readFileSync('/tmp/remote-hashes.json', 'utf8'));

          function objects(value) {
            if (Array.isArray(value)) return value.flatMap(objects);
            if (!value || typeof value !== 'object') return [];
            return [value, ...Object.values(value).flatMap(objects)];
          }

          const expected = {
            reviews: reviews.length,
            credits: Object.values(creditsDoc.records || {}).reduce(
              (total, groups) => total + (Array.isArray(groups)
                ? groups.reduce((sum, group) => sum + (Array.isArray(group) ? group.filter(Boolean).length : 0), 0)
                : 0),
              0,
            ),
            gallery: reviews.reduce((total, review) => total + (Array.isArray(review.gallery) ? review.gallery.length : 0), 0),
          };

          const countRow = objects(countsPayload).find(
            (row) => ['reviews', 'credits', 'gallery', 'audits', 'unique_slugs'].every((key) => Object.hasOwn(row, key)),
          );
          if (!countRow) throw new Error('Could not read D1 verification counts.');

          for (const [key, value] of Object.entries({
            reviews: expected.reviews,
            credits: expected.credits,
            gallery: expected.gallery,
            audits: expected.reviews,
            unique_slugs: expected.reviews,
          })) {
            if (Number(countRow[key]) !== value) {
              throw new Error(`${key} mismatch: expected ${value}, got ${countRow[key]}`);
            }
          }

          const remoteHashes = new Map(
            objects(hashesPayload)
              .filter((row) => typeof row.slug === 'string' && typeof row.source_sha256 === 'string')
              .map((row) => [row.slug.toLowerCase(), row.source_sha256]),
          );

          if (remoteHashes.size !== reviews.length) {
            throw new Error(`Audit hash count mismatch: expected ${reviews.length}, got ${remoteHashes.size}`);
          }

          for (const review of reviews) {
            const slug = String(review.s || '').toLowerCase();
            const expectedHash = crypto.createHash('sha256').update(JSON.stringify(review)).digest('hex');
            if (remoteHashes.get(slug) !== expectedHash) {
              throw new Error(`Audit hash mismatch for ${slug}`);
            }
          }

          console.log(
            `Verified ${expected.reviews} reviews, ${expected.credits} credits, ${expected.gallery} gallery items, unique slugs and source hashes.`,
          );
          NODE
