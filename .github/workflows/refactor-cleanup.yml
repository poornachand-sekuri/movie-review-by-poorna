name: Refactor Cleanup

on:
  push:
    branches:
      - cinema-rebuild
    paths:
      - '.github/refactor.trigger'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: cinema-rebuild
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply cleanup and structure refactor
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import re

          obsolete = [
              '.github/auditorium-assets.trigger',
              '.github/auditorium-assets.trigger.tmp',
              '.github/auditorium-assets.trigger2',
              '.github/auditorium-assets.trigger3',
              '.github/auditorium-assets.trigger4',
              '.github/auditorium-assets.trigger5',
              '.github/auditorium-assets.trigger6',
              '.github/auditorium-content.trigger',
              '.github/auditorium-public-probe.trigger',
              '.github/auditorium-visible-bounds.trigger',
              '.github/workflows/audit-auditorium-assets.yml',
              '.github/workflows/inspect-auditorium-content.yml',
              '.github/workflows/inspect-auditorium-visible-bounds.yml',
              '.github/workflows/probe-auditorium-public-assets.yml',
              'docs/auditorium-rebuild-note.txt',
          ]
          for name in obsolete:
              path = Path(name)
              if path.exists():
                  path.unlink()

          Path('.github/preview.trigger').write_text(
              'Deploy the current cinema-rebuild branch to the temporary preview Worker.\n'
              'Keep approved room artwork, behavior, data APIs and current interaction contracts unchanged.\n',
              encoding='utf-8',
          )

          site_frame = Path('src/layouts/SiteFrame.astro')
          text = site_frame.read_text(encoding='utf-8')
          text = text.replace("import '../styles/auditorium-comments.css';\n", '')
          site_frame.write_text(text, encoding='utf-8')

          review_page = Path('src/pages/review/[slug].astro')
          text = review_page.read_text(encoding='utf-8')
          text = text.replace(
              "import { getReviewBySlug, listRelatedReviewsByCredits, listReviews } from '../../lib/data/reviews';",
              "import { getReviewBySlug, listRelatedReviews } from '../../lib/data/reviews';",
          )
          if "import '../../styles/auditorium-comments.css';" not in text:
              text = text.replace(
                  "import '../../styles/auditorium-reactions.css';\n",
                  "import '../../styles/auditorium-reactions.css';\nimport '../../styles/auditorium-comments.css';\n",
              )
          old_related = """const creditMatches = await listRelatedReviewsByCredits(review.id, 4);\nconst relatedReviews = [...creditMatches];\nconst relatedSlugs = new Set([review.slug, ...relatedReviews.map((item) => item.slug)]);\n\nif (relatedReviews.length < 4 && review.language) {\n  const sameLanguageFallback = await listReviews({ limit: 20, language: review.language });\n  for (const item of sameLanguageFallback) {\n    if (relatedSlugs.has(item.slug)) continue;\n    relatedReviews.push(item);\n    relatedSlugs.add(item.slug);\n    if (relatedReviews.length === 4) break;\n  }\n}\n\nif (relatedReviews.length < 4) {\n  const generalFallback = await listReviews({ limit: 24 });\n  for (const item of generalFallback) {\n    if (relatedSlugs.has(item.slug)) continue;\n    relatedReviews.push(item);\n    relatedSlugs.add(item.slug);\n    if (relatedReviews.length === 4) break;\n  }\n}\n"""
          if old_related not in text:
              raise SystemExit('Expected related-review page block was not found.')
          text = text.replace(old_related, "const relatedReviews = await listRelatedReviews(review, 4);\n")
          review_page.write_text(text, encoding='utf-8')

          reviews = Path('src/lib/data/reviews.ts')
          text = reviews.read_text(encoding='utf-8')
          marker = "\nexport async function getReviewBySlug(slug: string): Promise<ReviewDetail | null> {"
          helper = r'''

export async function listRelatedReviews(
  review: Pick<ReviewDetail, 'id' | 'slug' | 'language'>,
  limit = 4,
): Promise<readonly ReviewSummary[]> {
  const requestedLimit = clampInteger(limit, 4, 1, 4);
  const selected = [...(await listRelatedReviewsByCredits(review.id, requestedLimit))];
  const seenSlugs = new Set([review.slug, ...selected.map((item) => item.slug)]);

  const appendUnique = (items: readonly ReviewSummary[]) => {
    for (const item of items) {
      if (seenSlugs.has(item.slug)) continue;
      selected.push(item);
      seenSlugs.add(item.slug);
      if (selected.length >= requestedLimit) break;
    }
  };

  if (selected.length < requestedLimit && review.language) {
    appendUnique(await listReviews({ limit: 20, language: review.language }));
  }

  if (selected.length < requestedLimit) {
    appendUnique(await listReviews({ limit: 24 }));
  }

  return selected.slice(0, requestedLimit);
}
'''
          if 'export async function listRelatedReviews(' not in text:
              if marker not in text:
                  raise SystemExit('Reviews data insertion point was not found.')
              text = text.replace(marker, helper + marker)
          reviews.write_text(text, encoding='utf-8')

          auditorium = Path('src/styles/auditorium.css')
          text = auditorium.read_text(encoding='utf-8')
          old_focus_controls = re.compile(
              r"\n\.auditorium-reading-toolbar \{.*?\n\.auditorium-font-control:focus-visible \{\n  outline: 2px solid #f0bb67;\n  outline-offset: 2px;\n\}\n",
              re.S,
          )
          text, count = old_focus_controls.subn('\n', text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one legacy focus-control block, found {count}.')

          mobile_blocks = [
              """\n  .auditorium-reading-toolbar {\n    width: 96%;\n    gap: 8px;\n    padding: 7px 9px;\n    border-radius: 18px;\n  }\n\n  .auditorium-reading-toolbar-message {\n    font-size: clamp(9px, 2.65vw, 11px);\n    line-height: 1.12;\n    letter-spacing: 0.025em;\n    text-transform: none;\n  }\n\n  .auditorium-reading-toolbar-actions {\n    gap: 5px;\n  }\n\n  .auditorium-font-control {\n    min-width: 42px;\n    height: 34px;\n    padding-inline: 8px;\n    font-size: 14px;\n  }\n""",
          ]
          for block in mobile_blocks:
              if block not in text:
                  raise SystemExit('Expected legacy mobile control block was not found.')
              text = text.replace(block, '\n')
          auditorium.write_text(text, encoding='utf-8')

          focus_css = Path('src/styles/auditorium-focus.css')
          text = focus_css.read_text(encoding='utf-8')
          text = text.replace(
              '/* Shared focus-mode refinements for Auditorium sections without dedicated focus artwork. */',
              '/* Shared Auditorium focus presentation, enlargement rules and reading controls. */',
          )
          focus_css.write_text(text, encoding='utf-8')

          Path('docs/CODE-STRUCTURE.md').write_text('''# Code Structure\n\nThis branch is organized around room ownership and shared infrastructure.\n\n## Pages\n- `src/pages/index.astro` — The Lounge page composition and Lounge-only interaction markup.\n- `src/pages/review/[slug].astro` — The Auditorium page composition. Data selection stays in `src/lib/data`; interaction controllers stay in `src/lib`.\n- `src/pages/search.astro` — The Movie Café page.\n- `src/pages/api` — public JSON endpoints. Keep request parsing here and persistence in `src/lib/data`.\n\n## Shared runtime\n- `src/layouts/SiteFrame.astro` — shared document shell, global styles and shared browser initialization.\n- `src/domain` — application-facing data types.\n- `src/lib/data` — D1 queries and selection rules. UI templates should not duplicate database fallback logic.\n- `src/lib/cloudflare` — Cloudflare binding access.\n- `src/lib/http` — HTTP helpers shared by API routes.\n\n## Lounge\n- `src/lib/lounge-assets.ts` — approved runtime artwork URLs.\n- `src/lib/lounge-loading.ts` — loader state machine.\n- `src/components/lounge/LoungeLoading.astro` — visual loader shell.\n- `src/styles/lounge.css` imports `lounge-reset.css`; do not split presentation across new override files unless a feature has a clear independent owner.\n\n## Auditorium\n- `src/lib/auditorium-assets.ts` — approved artwork registry and source dimensions.\n- `src/lib/auditorium-focus.ts` — one focus-mode controller for all Auditorium sections.\n- `src/lib/auditorium-reactions.ts` — browser reaction behavior.\n- `src/styles/auditorium.css` — base section geometry and content overlays.\n- `src/styles/auditorium-focus.css` — focus-only presentation and reading controls.\n- `src/styles/auditorium-navigation.css` — source-aligned navigation hit areas.\n- `src/styles/auditorium-reactions.css` — source-aligned reaction controls.\n- `src/styles/auditorium-comments.css` — Auditorium opinion/comment geometry only.\n\n## Comments\n- `src/lib/comments-client.ts` — shared Lounge/Auditorium browser controller.\n- `src/styles/comments.css` — shared comment cards, status toast and utility presentation.\n- room-specific placement belongs in the room stylesheet, not in `comments.css`.\n\n## Database\n- `migrations` are append-only history. Do not delete an applied migration as part of normal cleanup.\n- persistence modules live in `src/lib/data`; pages consume domain objects rather than raw D1 rows.\n\n## CI\n- `.github/workflows/validate-cinema-rebuild.yml` — guardrails, tests and static checks.\n- `.github/workflows/deploy-preview.yml` — temporary Worker build, deploy and smoke tests.\n- one-off inspection workflows should be removed after their measurements are captured in runtime code.\n\n## Maintenance rules\n1. Keep one clear owner for each rule or interaction; remove older overrides after a replacement is approved.\n2. Keep visual source geometry beside the room feature that consumes it.\n3. Keep database selection/fallback rules out of page templates.\n4. Run `npm run validate` and `npm run build` before deployment.\n5. Preserve applied migrations and production data during cleanup.\n''', encoding='utf-8')
          PY

      - name: Validate refactor
        run: npm run validate

      - name: Build refactor
        run: npm run build

      - name: Commit refactor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'poornachand-sekuri'
          git config user.email 'poornarocks@gmail.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No refactor changes detected.'
            exit 0
          fi
          git commit -m 'Refactor runtime structure and remove obsolete diagnostics'
          git push origin HEAD:cinema-rebuild
