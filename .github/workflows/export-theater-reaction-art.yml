name: Export Theater Reaction Art

on:
  push:
    branches:
      - cinema-rebuild
    paths:
      - '.github/theater-reaction-art.trigger'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download approved Theater artwork
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/reaction-art
          python3 -m pip install --quiet pillow
          python3 <<'PY'
          from io import BytesIO
          import urllib.request
          from PIL import Image

          base='https://assets.moviereviewbypoorna.com/ui/pages/content/v4/res%70onsive/'
          files={
              'normal':'04_Theater_Seats_Reactions_transparent_runtime_q99.webp',
              'focus':'09_Theater_Focus_Overlay_transparent_runtime_q99.webp',
          }
          for stem,name in files.items():
              req=urllib.request.Request(base+name,headers={'User-Agent':'MovieReviewByPoorna-ReactionAudit/1.0'})
              with urllib.request.urlopen(req,timeout=20) as response:
                  data=response.read()
              image=Image.open(BytesIO(data)).convert('RGBA')
              image.save(f'/tmp/reaction-art/{stem}.png')
              print(stem, image.size)
          PY
      - name: Upload Theater artwork
        uses: actions/upload-artifact@v4
        with:
          name: theater-reaction-art
          path: /tmp/reaction-art/*.png
          retention-days: 1
