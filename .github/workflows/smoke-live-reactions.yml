name: Smoke Test Live Reactions

on:
  push:
    branches:
      - main

jobs:
  live-reactions:
    runs-on: ubuntu-latest
    steps:
      - name: Verify production reactions endpoint
        shell: bash
        run: |
          set -euo pipefail
          url='https://movie-review-by-poorna.poornarocks.workers.dev/api/reactions?slug=dc'
          body=''
          status=''

          for attempt in {1..12}; do
            status=$(curl -sS -o /tmp/reactions.json -w '%{http_code}' "$url" || true)
            if [ "$status" = '200' ]; then
              body=$(cat /tmp/reactions.json)
              break
            fi
            sleep 5
          done

          if [ "$status" != '200' ]; then
            echo "Production reactions endpoint returned HTTP $status"
            cat /tmp/reactions.json 2>/dev/null || true
            exit 1
          fi

          node - "$body" <<'NODE'
          const payload = JSON.parse(process.argv[2]);
          if (!Number.isInteger(payload.like) || payload.like < 0) {
            throw new Error(`Invalid like count: ${payload.like}`);
          }
          if (!Number.isInteger(payload.dislike) || payload.dislike < 0) {
            throw new Error(`Invalid dislike count: ${payload.dislike}`);
          }
          if (![null, 'like', 'dislike'].includes(payload.myVote)) {
            throw new Error(`Invalid myVote value: ${payload.myVote}`);
          }
          console.log(`Live reactions OK: like=${payload.like}, dislike=${payload.dislike}, myVote=${payload.myVote}`);
          NODE
