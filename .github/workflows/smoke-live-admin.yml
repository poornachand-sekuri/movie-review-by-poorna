name: Smoke Live Admin

on:
  push:
    branches:
      - main

jobs:
  live-admin:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Admin assets and public dynamic data
        shell: bash
        run: |
          set -euo pipefail
          base='https://movie-review-by-poorna.poornarocks.workers.dev'
          ready='false'

          for attempt in {1..12}; do
            admin_status=$(curl -sS -o /tmp/admin.html -w '%{http_code}' "$base/admin/" || true)
            data_status=$(curl -sS -o /tmp/index.json -w '%{http_code}' "$base/data/index.json" || true)
            if [ "$admin_status" = '200' ] && [ "$data_status" = '200' ] && \
               grep -q 'Admin Console' /tmp/admin.html && \
               node - /tmp/index.json <<'NODE'
          const fs = require('fs');
          const rows = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (!Array.isArray(rows) || rows.length < 130) process.exit(1);
          if (!rows.every(row => row && typeof row.s === 'string' && typeof row.t === 'string')) process.exit(1);
          NODE
            then
              ready='true'
              break
            fi
            sleep 5
          done

          if [ "$ready" != 'true' ]; then
            echo 'Admin Console or dynamic review catalog did not become ready.'
            exit 1
          fi

          session_status=$(curl -sS -o /tmp/session.json -w '%{http_code}' "$base/api/admin/session" || true)
          if [ "$session_status" != '401' ] && [ "$session_status" != '200' ]; then
            echo "Unexpected Admin session endpoint status: $session_status"
            cat /tmp/session.json || true
            exit 1
          fi

          # A deliberately wrong password must return 401 when both Admin secrets are configured.
          # If ADMIN_PASSWORD or ADMIN_SESSION_SECRET is missing, the Worker returns 503 instead.
          login_status=$(curl -sS -o /tmp/login.json -w '%{http_code}' \
            -X POST "$base/api/admin/login" \
            -H "Origin: $base" \
            -H 'Content-Type: application/json' \
            --data '{"password":"__smoke_test_intentionally_wrong_password__"}' || true)
          if [ "$login_status" != '401' ]; then
            echo "Admin secrets are not confirmed; wrong-password probe returned HTTP $login_status"
            cat /tmp/login.json || true
            exit 1
          fi

          echo 'Admin assets, dynamic catalog, protected session endpoint and configured Admin secrets are live.'
