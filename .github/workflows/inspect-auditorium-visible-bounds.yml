name: Inspect Auditorium Visible Bounds

on:
  push:
    branches:
      - cinema-rebuild
    paths:
      - '.github/auditorium-visible-bounds.trigger'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Measure visible canvas bounds
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 <<'PY'
          from io import BytesIO
          from PIL import Image, ImageChops, ImageStat
          import urllib.parse, urllib.request

          base = 'https://assets.moviereviewbypoorna.com/ui/pages/content/v4/' + 'res' + 'ponsive/'
          files = [
            '02_Movie_Reviews_By_Poorna_Banner_runtime_q99.webp',
            '03_Clapboard_Details_transparent_runtime_q99.webp',
            '04_Theater_Seats_Reactions_transparent_runtime_q99.webp',
            '05_Share_This_Review_transparent_runtime_q99.webp',
            '06_Related_Reviews_transparent_runtime_q99.webp',
            '07_Share_Your_Opinion_Panel_runtime_q99.webp',
            '08_Lounge_Cini_Cafe_Banner_runtime_q99.webp',
          ]

          def fetch(name):
            req = urllib.request.Request(base + urllib.parse.quote(name), headers={'User-Agent':'MovieReviewByPoorna-Bounds/1.0'})
            with urllib.request.urlopen(req, timeout=10) as r:
              return r.read()

          for name in files:
            im = Image.open(BytesIO(fetch(name))).convert('RGBA')
            w,h = im.size
            alpha = im.getchannel('A')
            alpha_bbox = alpha.getbbox()
            aext = alpha.getextrema()

            # Border-colour-relative visual bbox. Helpful for opaque artwork that
            # contains large dark/blank margins inside an otherwise full canvas.
            border = []
            step_x = max(1, w // 100)
            step_y = max(1, h // 100)
            px = im.load()
            for x in range(0, w, step_x):
              border.append(px[x,0][:3]); border.append(px[x,h-1][:3])
            for y in range(0, h, step_y):
              border.append(px[0,y][:3]); border.append(px[w-1,y][:3])
            bg = tuple(sorted(c[i] for c in border)[len(border)//2] for i in range(3))

            rgb = im.convert('RGB')
            bg_im = Image.new('RGB', im.size, bg)
            diff = ImageChops.difference(rgb, bg_im).convert('L')
            # Ignore tiny WebP noise; threshold meaningful visual deviation.
            mask = diff.point(lambda v: 255 if v > 18 else 0)
            visual_bbox = mask.getbbox()

            print(f'BOUND\t{name}\tcanvas={w}x{h}\talpha={aext}\talpha_bbox={alpha_bbox}\tbg={bg}\tvisual_bbox={visual_bbox}')
          PY
