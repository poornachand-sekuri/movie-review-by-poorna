name: One-time Adipurush Opinion Cleanup

on:
  push:
    branches:
      - fresh-take-mobile-v2

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Run one-time Adipurush opinion cleanup'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fresh-take-mobile-v2
          fetch-depth: 0

      - name: Remove opinion article and enrichment
        run: |
          node - <<'NODE'
          const fs = require('fs');

          const reviewPath = 'public/data/index.json';
          const castPath = 'public/data/cast-crew.json';
          const targetReviewSlug = 'my-opinion-on-various-opinions-on-adipursh-%f0%9f%98%89';
          const targetCastSlug = 'my-opinion-on-various-opinions-on-adipursh';

          const reviews = JSON.parse(fs.readFileSync(reviewPath, 'utf8'));
          const before = reviews.length;
          const filtered = reviews.filter(review => review.s !== targetReviewSlug);

          if (before !== 137 || filtered.length !== 136) {
            throw new Error(`Unexpected review count during cleanup: before=${before}, after=${filtered.length}`);
          }
          if (filtered.some(review => review.s === targetReviewSlug)) {
            throw new Error('Target opinion article was not removed');
          }
          if (!filtered.some(review => review.s === 'adipurush')) {
            throw new Error('Normal Adipurush review must remain');
          }

          const castCrew = JSON.parse(fs.readFileSync(castPath, 'utf8'));
          if (!castCrew.records?.[targetCastSlug]) {
            throw new Error('Expected opinion-post Cast & Crew entry was not found');
          }
          delete castCrew.records[targetCastSlug];

          fs.writeFileSync(reviewPath, JSON.stringify(filtered));
          fs.writeFileSync(castPath, JSON.stringify(castCrew));

          console.log('Removed the opinion article and its enrichment record. Normal Adipurush remains.');
          NODE

      - name: Verify cleaned data
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const reviews = JSON.parse(fs.readFileSync('public/data/index.json', 'utf8'));
          const castCrew = JSON.parse(fs.readFileSync('public/data/cast-crew.json', 'utf8'));
          if (reviews.length !== 136) throw new Error(`Expected 136 reviews, found ${reviews.length}`);
          if (reviews.some(r => r.s === 'my-opinion-on-various-opinions-on-adipursh-%f0%9f%98%89')) throw new Error('Opinion article still present');
          if (castCrew.records['my-opinion-on-various-opinions-on-adipursh']) throw new Error('Opinion enrichment still present');
          if (!reviews.some(r => r.s === 'adipurush')) throw new Error('Normal Adipurush review missing');
          if (!castCrew.records['adipurush']) throw new Error('Normal Adipurush enrichment missing');
          NODE

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/index.json public/data/cast-crew.json
          git commit -m "Remove Adipurush opinion article"
          git push origin HEAD:fresh-take-mobile-v2
