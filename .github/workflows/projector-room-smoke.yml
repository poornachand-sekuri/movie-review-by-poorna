name: Projector Room Smoke

on:
  push:
    branches:
      - cinema-rebuild
    paths:
      - '.github/workflows/projector-room-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify Projector Room and unauthenticated lock
        shell: bash
        run: |
          set -euo pipefail
          base='https://movie-review-by-poorna-preview.poornarocks.workers.dev'

          curl --fail --silent --show-error --retry 8 --retry-delay 2 --retry-all-errors "$base/admin/" > /tmp/admin.html
          grep -q 'The Projector Room' /tmp/admin.html
          grep -q '/admin/admin.css' /tmp/admin.html
          grep -q '/admin/admin.js' /tmp/admin.html

          curl --fail --silent --show-error "$base/admin/admin.css" > /tmp/admin.css
          curl --fail --silent --show-error "$base/admin/admin.js" > /tmp/admin.js
          grep -q -- '--gold' /tmp/admin.css
          grep -q '/api/admin/session' /tmp/admin.js

          assert_locked() {
            local path="$1"
            local code
            code=$(curl --silent --show-error --output /tmp/body --write-out '%{http_code}' "$base$path")
            test "$code" = '401' || { echo "$path returned $code, expected 401"; cat /tmp/body; exit 1; }
          }

          assert_locked '/api/admin/session'
          assert_locked '/api/admin/reviews'
          assert_locked '/api/admin/comments?status=pending'
          assert_locked '/api/admin/analytics?days=30'

          login_code=$(curl --silent --show-error --output /tmp/login --write-out '%{http_code}' \
            -X POST -H 'content-type: application/json' --data '{"password":""}' "$base/api/admin/login")
          case "$login_code" in
            401|503) ;;
            *) echo "Unexpected unauthenticated login status: $login_code"; cat /tmp/login; exit 1 ;;
          esac

          echo "Projector Room shell is live and all protected data endpoints reject unauthenticated access. Login probe status: $login_code"
