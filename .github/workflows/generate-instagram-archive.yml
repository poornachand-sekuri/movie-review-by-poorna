name: Generate Instagram Archive

on:
  push:
    branches:
      - chore/instagram-140-assets
    paths:
      - 'scripts/generate-instagram-archive-v2.mjs'
      - 'scripts/generate-instagram-archive-v3.mjs'
      - 'scripts/generate-instagram-archive-v4.mjs'
      - 'scripts/generate-instagram-archive-v5.mjs'
      - '.github/workflows/generate-instagram-archive.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: instagram-archive-140
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install renderer and font fallbacks
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core fonts-noto-extra fonts-noto-color-emoji
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Generate all 140 Instagram carousels
        run: node scripts/generate-instagram-archive-v5.mjs

      - name: Package images
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          zip -9 -r movie-review-by-poorna-instagram-140.zip instagram-140 >/dev/null
          ls -lh movie-review-by-poorna-instagram-140.zip

      - name: Upload downloadable archive
        uses: actions/upload-artifact@v4
        with:
          name: movie-review-by-poorna-instagram-140
          path: artifacts/movie-review-by-poorna-instagram-140.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
