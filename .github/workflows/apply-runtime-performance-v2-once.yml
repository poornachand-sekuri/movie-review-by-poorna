name: Apply Measured Runtime Performance Fixes Once

on:
  push:
    branches:
      - optimize/runtime-performance

permissions:
  contents: write

jobs:
  apply-performance-fixes:
    if: github.event.head_commit.message == 'Apply measured runtime performance fixes once'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout performance branch
        uses: actions/checkout@v5
        with:
          ref: optimize/runtime-performance

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install application dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Generate visually equivalent lightweight theater artwork
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix /tmp/image-tools sharp ssim.js --no-audit --no-fund
          mkdir -p assets/images/content-v2 /tmp/content-ui-source

          curl -fsSL --retry 3 --retry-all-errors --max-time 120 \
            'https://assets.moviereviewbypoorna.com/ui/pages/content/v2/mobile/07-theater-top-LOCKED.avif?v=20260831-final-theater' \
            -o /tmp/content-ui-source/theater-top.avif
          curl -fsSL --retry 3 --retry-all-errors --max-time 120 \
            'https://assets.moviereviewbypoorna.com/ui/pages/content/v2/mobile/08-theater-middle-stretchable-LOCKED.avif?v=20260831-final-theater' \
            -o /tmp/content-ui-source/theater-middle.avif
          curl -fsSL --retry 3 --retry-all-errors --max-time 120 \
            'https://assets.moviereviewbypoorna.com/ui/pages/content/v2/mobile/09-theater-bottom-seats-LOCKED.avif?v=20260831-final-theater' \
            -o /tmp/content-ui-source/theater-bottom.avif

          NODE_PATH=/tmp/image-tools/node_modules node <<'NODE'
          const fs = require('fs');
          const sharp = require('sharp');
          const { ssim } = require('ssim.js');

          const files = [
            { key: 'theater-top', width: 1535, height: 248, maxBytes: 15000, minSsim: 0.994 },
            { key: 'theater-middle', width: 1535, height: 392, maxBytes: 8000, minSsim: 0.994 },
            { key: 'theater-bottom', width: 1535, height: 384, maxBytes: 60000, minSsim: 0.995 }
          ];

          async function rawAtDisplayWidth(file) {
            const result = await sharp(file)
              .resize({ width: 520, withoutEnlargement: true })
              .ensureAlpha()
              .raw()
              .toBuffer({ resolveWithObject: true });
            return {
              data: new Uint8Array(result.data),
              width: result.info.width,
              height: result.info.height
            };
          }

          (async () => {
            let sourceTotal = 0;
            let optimizedTotal = 0;

            for (const item of files) {
              const source = `/tmp/content-ui-source/${item.key}.avif`;
              const output = `assets/images/content-v2/${item.key}-q58.avif`;
              const metadata = await sharp(source).metadata();
              if (metadata.width !== item.width || metadata.height !== item.height) {
                throw new Error(`${item.key}: unexpected source geometry ${metadata.width}x${metadata.height}`);
              }

              await sharp(source)
                .avif({ quality: 58, effort: 6, chromaSubsampling: '4:2:0' })
                .toFile(output);

              const outputMetadata = await sharp(output).metadata();
              if (outputMetadata.width !== item.width || outputMetadata.height !== item.height) {
                throw new Error(`${item.key}: optimized geometry changed`);
              }

              const reference = await rawAtDisplayWidth(source);
              const candidate = await rawAtDisplayWidth(output);
              const similarity = ssim(reference, candidate, { downsample: 'original' }).mssim;
              const sourceBytes = fs.statSync(source).size;
              const optimizedBytes = fs.statSync(output).size;
              sourceTotal += sourceBytes;
              optimizedTotal += optimizedBytes;

              if (optimizedBytes > item.maxBytes) {
                throw new Error(`${item.key}: optimized file is too large (${optimizedBytes} bytes)`);
              }
              if (similarity < item.minSsim) {
                throw new Error(`${item.key}: display-width SSIM is too low (${similarity})`);
              }

              console.log(`${item.key}: ${sourceBytes} -> ${optimizedBytes} bytes; display SSIM=${similarity.toFixed(5)}`);
            }

            const reduction = 100 * (1 - optimizedTotal / sourceTotal);
            console.log(`Theater artwork total: ${sourceTotal} -> ${optimizedTotal} bytes (${reduction.toFixed(1)}% reduction).`);
            if (reduction < 95) throw new Error(`Expected at least 95% theater artwork reduction, got ${reduction.toFixed(1)}%`);
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Apply loading, caching and Cine Cafe discovery fixes
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import json

          config_path = Path('assets/js/config.js')
          config = config_path.read_text()
          replacements = {
              "theaterTop: '07-theater-top-LOCKED.avif?v=20260831-final-theater'": "theaterTop: '/assets/images/content-v2/theater-top-q58.avif?v=20260901-runtime-1'",
              "theaterMiddle: '08-theater-middle-stretchable-LOCKED.avif?v=20260831-final-theater'": "theaterMiddle: '/assets/images/content-v2/theater-middle-q58.avif?v=20260901-runtime-1'",
              "theaterBottom: '09-theater-bottom-seats-LOCKED.avif?v=20260831-final-theater'": "theaterBottom: '/assets/images/content-v2/theater-bottom-q58.avif?v=20260901-runtime-1'",
          }
          for old, new in replacements.items():
              if old not in config:
                  raise SystemExit(f'Missing config marker: {old}')
              config = config.replace(old, new, 1)

          old_function = """export function uiAsset(name) {
            return `${CONFIG.uiAssetBase}/${CONFIG.assets[name]}`;
          }
          """
          new_function = """export function uiAsset(name) {
            const asset = CONFIG.assets[name];
            if (typeof asset !== 'string') return '';
            if (asset.startsWith('/') || /^https?:\\/\\//i.test(asset)) return asset;
            return `${CONFIG.uiAssetBase}/${asset}`;
          }
          """
          if old_function not in config:
              raise SystemExit('Could not find uiAsset helper')
          config = config.replace(old_function, new_function, 1)
          config_path.write_text(config)

          app_path = Path('assets/js/app.js')
          app = app_path.read_text()
          old_set_asset = """function setAsset(img, name) {
            img.src = uiAsset(name);
            img.decoding = 'async';
          }
          """
          new_set_asset = """const UI_IMAGE_DIMENSIONS = {
            header: [1934, 320],
            clapTop: [2025, 275],
            posterFrame: [1122, 1402],
            theaterTop: [1535, 248],
            theaterBottom: [1535, 384],
            relatedHeader: [2048, 326],
            commentsHeader: [1496, 193]
          };

          function setAsset(img, name, { loading = 'eager', fetchPriority = 'auto' } = {}) {
            if (!img) return;
            const dimensions = UI_IMAGE_DIMENSIONS[name];
            if (dimensions) {
              img.width = dimensions[0];
              img.height = dimensions[1];
            }
            img.decoding = 'async';
            img.loading = loading;
            if (fetchPriority !== 'auto') img.fetchPriority = fetchPriority;
            img.src = uiAsset(name);
          }

          function deferBackground(element, name) {
            if (!element) return;
            element.dataset.uiBackground = uiAsset(name);
          }

          function applyDeferredBackground(element) {
            const source = element?.dataset?.uiBackground;
            if (!source) return;
            element.style.backgroundImage = `url("${source}")`;
            delete element.dataset.uiBackground;
          }

          function observeDeferredBackgrounds(root) {
            const targets = [...root.querySelectorAll('[data-ui-background]')];
            if (!targets.length) return;
            if (!('IntersectionObserver' in window)) {
              targets.forEach(applyDeferredBackground);
              return;
            }

            const observer = new IntersectionObserver(entries => {
              for (const entry of entries) {
                if (!entry.isIntersecting) continue;
                applyDeferredBackground(entry.target);
                observer.unobserve(entry.target);
              }
            }, { rootMargin: '600px 0px' });

            targets.forEach(target => observer.observe(target));
          }
          """
          if old_set_asset not in app:
              raise SystemExit('Could not find setAsset helper')
          app = app.replace(old_set_asset, new_set_asset, 1)

          old_setup = """function setupArtwork(root) {
            setAsset($('#brandArtwork'), 'header');
            setAsset($('.clapboard-top', root), 'clapTop');
            $('.clapboard-bg', root).style.backgroundImage = `url("${uiAsset('clapBody')}")`;
            $('.reaction-bg', root).style.backgroundImage = `url("${uiAsset('likeFrame')}")`;
            setAsset($('.poster-frame-art', root), 'posterFrame');
            setAsset($('.theater-top', root), 'theaterTop');
            $('.theater-middle', root).style.backgroundImage = `url("${uiAsset('theaterMiddle')}")`;
            setAsset($('.theater-bottom', root), 'theaterBottom');
            setAsset($('.related-header', root), 'relatedHeader');
            $('.related-reel', root).style.backgroundImage = `url("${uiAsset('relatedReel')}")`;
            setAsset($('.comments-header', root), 'commentsHeader');
            $('.comments-bg', root).style.backgroundImage = `url("${uiAsset('commentsShell')}")`;
            document.documentElement.style.setProperty('--related-comments-gap', `${CONFIG.relatedToCommentsGapPx}px`);
          }
          """
          new_setup = """function setupArtwork(root) {
            setAsset($('#brandArtwork'), 'header', { fetchPriority: 'high' });
            setAsset($('.clapboard-top', root), 'clapTop', { fetchPriority: 'high' });
            $('.clapboard-bg', root).style.backgroundImage = `url("${uiAsset('clapBody')}")`;
            deferBackground($('.reaction-bg', root), 'likeFrame');
            setAsset($('.poster-frame-art', root), 'posterFrame');
            setAsset($('.theater-top', root), 'theaterTop', { fetchPriority: 'high' });
            $('.theater-middle', root).style.backgroundImage = `url("${uiAsset('theaterMiddle')}")`;
            setAsset($('.theater-bottom', root), 'theaterBottom', { loading: 'lazy', fetchPriority: 'low' });
            setAsset($('.related-header', root), 'relatedHeader', { loading: 'lazy', fetchPriority: 'low' });
            deferBackground($('.related-reel', root), 'relatedReel');
            setAsset($('.comments-header', root), 'commentsHeader', { loading: 'lazy', fetchPriority: 'low' });
            deferBackground($('.comments-bg', root), 'commentsShell');
            document.documentElement.style.setProperty('--related-comments-gap', `${CONFIG.relatedToCommentsGapPx}px`);
          }
          """
          if old_setup not in app:
              raise SystemExit('Could not find setupArtwork block')
          app = app.replace(old_setup, new_setup, 1)

          app = app.replace(
              "poster.loading = 'lazy';\n    posterZone.append(poster);",
              "poster.loading = 'lazy';\n    poster.decoding = 'async';\n    posterZone.append(poster);",
              1
          )
          app = app.replace(
              "poster.src = movie.m;\n  poster.alt = `${movie.t} poster`;",
              "poster.src = movie.m;\n  poster.alt = `${movie.t} poster`;\n  poster.decoding = 'async';\n  poster.fetchPriority = 'high';",
              1
          )
          old_tail = """  content.replaceChildren(fragment);
            document.documentElement.dataset.activeReviewSlug = movie.s;
            $('#app').setAttribute('aria-busy', 'false');
          """
          new_tail = """  content.replaceChildren(fragment);
            document.documentElement.dataset.activeReviewSlug = movie.s;
            observeDeferredBackgrounds(content);
            $('#app').setAttribute('aria-busy', 'false');
          """
          if old_tail not in app:
              raise SystemExit('Could not find renderMovie insertion point')
          app = app.replace(old_tail, new_tail, 1)
          app_path.write_text(app)

          cafe_path = Path('cine-cafe/index.html')
          cafe = cafe_path.read_text()
          marker = '  <link rel="preconnect" href="https://assets.moviereviewbypoorna.com" crossorigin>\n'
          preload = marker + '  <link rel="preload" as="image" href="https://assets.moviereviewbypoorna.com/ui/pages/cine-cafe/v2/mobile/Cine_Cafe_Master_2x3_BWR_Final.avif" fetchpriority="high">\n'
          if marker not in cafe:
              raise SystemExit('Could not find Cine Cafe asset preconnect')
          cafe = cafe.replace(marker, preload, 1)
          cafe_path.write_text(cafe)

          headers_path = Path('public/_headers')
          headers_path.write_text("""/assets/*
            Cache-Control: public, max-age=300, must-revalidate
          """)

          package_path = Path('package.json')
          package_data = json.loads(package_path.read_text())
          build = package_data['scripts']['build']
          marker = 'cp -R assets dist/assets && '
          replacement = 'cp -R assets dist/assets && cp public/_headers dist/_headers && '
          if marker not in build:
              raise SystemExit('Could not find package build asset copy marker')
          package_data['scripts']['build'] = build.replace(marker, replacement, 1)
          package_path.write_text(json.dumps(package_data, indent=2) + '\n')
          PY

      - name: Validate code and Worker bundle
        run: npm run validate

      - name: Confirm output and performance invariants
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          test -f dist/_headers
          test -f dist/assets/images/content-v2/theater-top-q58.avif
          test -f dist/assets/images/content-v2/theater-middle-q58.avif
          test -f dist/assets/images/content-v2/theater-bottom-q58.avif
          ! grep -q '07-theater-top-LOCKED' assets/js/config.js
          ! grep -q '08-theater-middle-stretchable-LOCKED' assets/js/config.js
          ! grep -q '09-theater-bottom-seats-LOCKED' assets/js/config.js
          ! grep -q '/data/index.json' assets/js/live-reactions.js
          ! grep -q '/data/index.json' assets/js/comments.js
          grep -q "observeDeferredBackgrounds(content)" assets/js/app.js
          grep -q 'max-age=300' dist/_headers

      - name: Run local mobile Content performance regression test
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/perf-server.mjs <<'NODE'
          import http from 'node:http';
          import fs from 'node:fs';
          import path from 'node:path';
          import zlib from 'node:zlib';
          import { URL } from 'node:url';

          const root = path.resolve('dist');
          const reviews = JSON.parse(fs.readFileSync('public/data/index.json', 'utf8'));
          const compact = reviews.map(({ body, gallery, ...review }) => review);

          function sendJson(request, response, payload) {
            const raw = Buffer.from(JSON.stringify(payload));
            const acceptsGzip = /gzip/.test(request.headers['accept-encoding'] || '');
            const body = acceptsGzip ? zlib.gzipSync(raw) : raw;
            response.writeHead(200, {
              'content-type': 'application/json; charset=utf-8',
              'cache-control': 'public, max-age=30',
              ...(acceptsGzip ? { 'content-encoding': 'gzip' } : {}),
              'content-length': body.length
            });
            response.end(body);
          }

          function contentType(file) {
            const ext = path.extname(file).toLowerCase();
            return {
              '.html': 'text/html; charset=utf-8',
              '.css': 'text/css; charset=utf-8',
              '.js': 'text/javascript; charset=utf-8',
              '.json': 'application/json; charset=utf-8',
              '.avif': 'image/avif',
              '.jpg': 'image/jpeg',
              '.png': 'image/png'
            }[ext] || 'application/octet-stream';
          }

          const server = http.createServer((request, response) => {
            const url = new URL(request.url, 'http://127.0.0.1:4173');
            if (url.pathname === '/data/catalog.json') return sendJson(request, response, compact);
            if (url.pathname === '/data/content.json') {
              const slug = url.searchParams.get('review') || compact[0]?.s;
              const active = reviews.find(review => review.s === slug) || reviews[0];
              return sendJson(request, response, { reviews: compact, active });
            }
            if (url.pathname === '/api/reactions') return sendJson(request, response, { like: 0, dislike: 0, myVote: null });
            if (url.pathname === '/api/comments') return sendJson(request, response, { comments: [] });
            if (url.pathname === '/api/analytics/pageview') return sendJson(request, response, { tracked: false });

            let pathname = decodeURIComponent(url.pathname);
            if (pathname === '/') pathname = '/index.html';
            if (pathname.endsWith('/')) pathname += 'index.html';
            let file = path.resolve(root, `.${pathname}`);
            if (!file.startsWith(root) || !fs.existsSync(file) || fs.statSync(file).isDirectory()) {
              file = path.join(root, 'index.html');
            }
            const body = fs.readFileSync(file);
            response.writeHead(200, {
              'content-type': contentType(file),
              'cache-control': file.endsWith('.html') ? 'no-cache' : 'public, max-age=300',
              'content-length': body.length
            });
            response.end(body);
          });

          server.listen(4173, '127.0.0.1', () => console.log('performance server ready'));
          NODE

          node /tmp/perf-server.mjs > /tmp/perf-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/?review=dc >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/data/content.json?review=dc >/dev/null

          npm install --global lighthouse@13.4.1 --no-audit --no-fund
          lighthouse 'http://127.0.0.1:4173/?review=dc' \
            --quiet \
            --only-categories=performance \
            --form-factor=mobile \
            --throttling-method=simulate \
            --screenEmulation.mobile=true \
            --screenEmulation.width=390 \
            --screenEmulation.height=844 \
            --screenEmulation.deviceScaleFactor=2 \
            --chrome-flags='--headless=new --no-sandbox --disable-dev-shm-usage' \
            --max-wait-for-load=120000 \
            --pause-after-load=2500 \
            --disable-full-page-screenshot \
            --output=json \
            --output-path=/tmp/content-after.json

          node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('/tmp/content-after.json', 'utf8'));
          const score = Math.round((report.categories.performance.score || 0) * 100);
          const lcp = report.audits['largest-contentful-paint'].numericValue;
          const bytes = report.audits['total-byte-weight'].numericValue;
          const requests = report.audits['network-requests']?.details?.items || [];
          const urls = requests.map(item => item.url);

          console.log(`After score=${score} LCP=${Math.round(lcp)}ms transfer=${Math.round(bytes)} bytes requests=${requests.length}`);
          console.log('Largest transferred resources:');
          [...requests]
            .sort((a, b) => (b.transferSize || 0) - (a.transferSize || 0))
            .slice(0, 12)
            .forEach(item => console.log(`${item.transferSize || 0} B | ${item.url}`));

          if (urls.some(url => url.includes('/data/index.json'))) {
            throw new Error('Obsolete full index.json request is still present.');
          }
          if (urls.some(url => /07-theater-top-LOCKED|08-theater-middle-stretchable-LOCKED|09-theater-bottom-seats-LOCKED/.test(url))) {
            throw new Error('Original heavyweight theater artwork is still requested.');
          }
          for (const expected of ['theater-top-q58.avif', 'theater-middle-q58.avif']) {
            if (!urls.some(url => url.includes(expected))) throw new Error(`Optimized ${expected} was not requested.`);
          }
          if (bytes > 1_150_000) throw new Error(`Content transfer regression: ${bytes} bytes`);
          if (lcp > 5_000) throw new Error(`Content LCP regression: ${lcp} ms`);
          if (score < 85) throw new Error(`Content performance score regression: ${score}`);
          NODE

      - name: Commit validated performance changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'poornachand-sekuri'
          git config user.email 'poornarocks@gmail.com'
          git add \
            assets/images/content-v2 \
            assets/js/config.js \
            assets/js/app.js \
            cine-cafe/index.html \
            public/_headers \
            package.json
          git diff --cached --check
          git commit -m 'Reduce Content payload and improve repeat navigation caching'
          git push origin HEAD:optimize/runtime-performance
