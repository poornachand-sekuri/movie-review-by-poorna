name: Measure Related Reviews Layout

on:
  push:
    branches:
      - cinema-rebuild
    paths:
      - '.github/related-layout.trigger'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Measure approved Related Reviews artwork
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow opencv-python-headless numpy
          python3 <<'PY'
          from io import BytesIO
          import urllib.request
          import cv2, numpy as np
          from PIL import Image

          url='https://assets.moviereviewbypoorna.com/ui/pages/content/v4/responsive/06_Related_Reviews_transparent_runtime_q99.webp'
          req=urllib.request.Request(url,headers={'User-Agent':'MovieReviewByPoorna-LayoutMeasure/1.0'})
          with urllib.request.urlopen(req, timeout=20) as r:
              data=r.read()
          rgba=np.array(Image.open(BytesIO(data)).convert('RGBA'))
          rgb=rgba[...,:3]
          alpha=rgba[...,3]
          h,w=rgb.shape[:2]
          print(f'CANVAS\t{w}\t{h}')

          hsv=cv2.cvtColor(rgb, cv2.COLOR_RGB2HSV)
          red=((((hsv[:,:,0] <= 10) | (hsv[:,:,0] >= 170)) & (hsv[:,:,1] >= 120) & (hsv[:,:,2] >= 95) & (alpha >= 24))).astype(np.uint8)

          # Print strong row/column activity in the central film-strip area.
          film=red[int(h*.18):int(h*.92), int(w*.04):int(w*.96)]
          rr=film.sum(axis=1)
          cc=film.sum(axis=0)
          for iy in np.argsort(rr)[-60:][::-1]:
              if rr[iy] >= 120:
                  print(f'RED_ROW\t{int(iy+int(h*.18))}\t{int(rr[iy])}')
          for ix in np.argsort(cc)[-80:][::-1]:
              if cc[ix] >= 70:
                  print(f'RED_COL\t{int(ix+int(w*.04))}\t{int(cc[ix])}')

          # Connected red components reveal the four rectangular bays and heading/borders.
          n,labels,stats,cent=cv2.connectedComponentsWithStats(red,8)
          comps=[]
          for i in range(1,n):
              x,y,cw,ch,area=map(int,stats[i])
              if area>=40:
                  comps.append((area,x,y,cw,ch,float(cent[i][0]),float(cent[i][1])))
          for row in sorted(comps, reverse=True)[:160]:
              print('RED_COMPONENT\t'+'\t'.join(map(str,row)))

          # Detect long red horizontal and vertical runs; these are the frame edges.
          def runs(line):
              idx=np.flatnonzero(line)
              if len(idx)==0: return []
              out=[]; s=p=idx[0]
              for v in idx[1:]:
                  if v==p+1: p=v
                  else:
                      out.append((s,p)); s=p=v
              out.append((s,p))
              return out

          for y in range(int(h*.20), int(h*.90)):
              for a,b in runs(red[y]):
                  if b-a+1 >= 180:
                      print(f'HRUN\t{y}\t{a}\t{b}\t{b-a+1}')
          for x in range(int(w*.06), int(w*.94)):
              for a,b in runs(red[:,x]):
                  if b-a+1 >= 110 and a >= int(h*.20):
                      print(f'VRUN\t{x}\t{a}\t{b}\t{b-a+1}')
          PY
