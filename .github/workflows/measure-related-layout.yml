name: Measure Related Reviews Layout

on:
  push:
    branches:
      - cinema-rebuild
    paths:
      - '.github/related-layout.trigger'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Measure approved Related Reviews artwork
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow opencv-python-headless numpy
          python3 <<'PY'
          from io import BytesIO
          import urllib.request
          import cv2, numpy as np
          from PIL import Image

          url='https://assets.moviereviewbypoorna.com/ui/pages/content/v4/responsive/06_Related_Reviews_transparent_runtime_q99.webp'
          req=urllib.request.Request(url,headers={'User-Agent':'MovieReviewByPoorna-LayoutMeasure/2.0'})
          with urllib.request.urlopen(req, timeout=20) as r:
              data=r.read()
          rgba=np.array(Image.open(BytesIO(data)).convert('RGBA'))
          rgb=rgba[...,:3]
          alpha=rgba[...,3]
          hsv=cv2.cvtColor(rgb, cv2.COLOR_RGB2HSV)
          h,w=rgb.shape[:2]
          print(f'CANVAS\t{w}\t{h}')

          slots=[('slot1',340,675),('slot2',726,1061),('slot3',1112,1446),('slot4',1497,1833)]
          for name,x0,x1 in slots:
              print(f'SLOT_INNER\t{name}\tleft={x0}\tright={x1}\ttop=245\tbottom=485\tcenter_x={(x0+x1)/2:.1f}')

          # Neutral/metal mask identifies the lower film-strip band, independent of red borders.
          neutral=((hsv[:,:,1] <= 90) & (hsv[:,:,2] >= 55) & (alpha >= 24)).astype(np.uint8)
          central=neutral[450:650,300:1870]
          rows=central.sum(axis=1)
          active=np.flatnonzero(rows>=120)
          bands=[]
          if len(active):
              s=p=active[0]
              for yy in active[1:]:
                  if yy<=p+2:
                      p=yy
                  else:
                      bands.append((s,p)); s=p=yy
              bands.append((s,p))
          for s,e in bands:
              weights=rows[s:e+1].astype(float)
              ys=np.arange(s,e+1)+450
              center=float((ys*weights).sum()/weights.sum()) if weights.sum() else (s+e)/2+450
              print(f'NEUTRAL_BAND\t{s+450}\t{e+450}\tcenter_y={center:.2f}\tpixels={int(weights.sum())}')

          # At each slot centre, report opaque/non-black vertical bands below the red bay.
          value=hsv[:,:,2]
          for name,x0,x1 in slots:
              cx=round((x0+x1)/2)
              strip=((alpha[:,cx] >= 24) & (value[:,cx] >= 18)).astype(np.uint8)
              active=np.flatnonzero(strip[480:690])
              bands=[]
              if len(active):
                  s=p=active[0]
                  for yy in active[1:]:
                      if yy<=p+1:
                          p=yy
                      else:
                          bands.append((s,p)); s=p=yy
                  bands.append((s,p))
              for s,e in bands:
                  if e-s+1>=2:
                      print(f'CENTER_BAND\t{name}\t{s+480}\t{e+480}')

          # Measure alpha density by row to find where artwork ends and transparent title-safe space begins.
          a=(alpha>=24).astype(np.uint8)
          ar=a[:,300:1870].sum(axis=1)
          for y in range(470,650):
              if y%5==0:
                  print(f'ALPHA_ROW\t{y}\t{int(ar[y])}')
          PY
