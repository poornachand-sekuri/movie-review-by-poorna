name: Deploy Production

on:
  workflow_run:
    workflows:
      - Validate Application
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      extended_checks:
        description: 'Run full live diagnostics (uses D1 quota and temporary test votes)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: movie-review-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_URL: https://moviereviewbypoorna.com

    steps:
      - name: Checkout validated production commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate manual production deployment
        if: github.event_name == 'workflow_dispatch'
        run: npm run validate

      - name: Build validated production commit
        run: npm run build

      - name: Reset go-live engagement data
        if: >-
          github.event_name == 'workflow_run' &&
          contains(github.event.workflow_run.head_commit.message, '[go-live-reset]')
        run: node scripts/apply-go-live-reset.mjs production

      - name: Measure original D1 query baseline (read-only)
        if: github.event_name == 'workflow_dispatch' && inputs.extended_checks == true
        run: node scripts/check-d1-reads.mjs before

      - name: Deploy production Worker
        run: node scripts/cloudflare.mjs production deploy

      - name: Check service health and one compact review
        run: node scripts/check-deployment.mjs "$PRODUCTION_URL" production

      - name: Compare sampled D1 reads after the change (read-only)
        if: github.event_name == 'workflow_dispatch' && inputs.extended_checks == true
        run: node scripts/check-d1-reads.mjs after

      - name: Smoke-test all four pages and APIs
        if: github.event_name == 'workflow_dispatch' && inputs.extended_checks == true
        run: npm run smoke -- "$PRODUCTION_URL" production

      - name: Verify preserved reaction import and aggregate totals
        if: github.event_name == 'workflow_dispatch' && inputs.extended_checks == true
        run: >-
          npx wrangler d1 execute CONTENT_DB --remote --config wrangler.jsonc
          --command "SELECT COUNT(*) AS published_reviews,
          COUNT(i.review_id) AS imported_review_stores,
          COALESCE(SUM(i.source_votes), 0) AS preserved_votes
          FROM reviews r LEFT JOIN legacy_reaction_imports i ON i.review_id = r.id
          WHERE r.status = 'published';
          SELECT r.slug, MAX(i.source_votes) AS preserved_votes,
          COALESCE(SUM(v.reaction = 'like'), 0) AS likes,
          COALESCE(SUM(v.reaction = 'dislike'), 0) AS dislikes
          FROM reviews r LEFT JOIN legacy_reaction_imports i ON i.review_id = r.id
          LEFT JOIN review_reaction_votes v ON v.review_id = r.id
          WHERE r.slug = 'dc' GROUP BY r.id;"

      - name: Audit all deployed content pages (read-only)
        if: github.event_name == 'workflow_dispatch' && inputs.extended_checks == true
        run: node scripts/audit-content.mjs https://moviereviewbypoorna.com
