name: Export Auditorium Opinion Art

on:
  push:
    branches:
      - cinema-rebuild
    paths:
      - '.github/auditorium-opinion-art.trigger'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download approved Opinion artwork
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/opinion-art
          python3 -m pip install --quiet pillow
          python3 <<'PY'
          from io import BytesIO
          import urllib.request
          from PIL import Image

          base='https://assets.moviereviewbypoorna.com/ui/pages/content/v4/res%70onsive/'
          files={
              'normal':'07_Share_Your_Opinion_Panel_runtime_q99.webp',
              'focus':'10_Share_Your_Opinion_With_Exit_runtime_q99.webp',
          }
          for stem,name in files.items():
              req=urllib.request.Request(base+name,headers={'User-Agent':'MovieReviewByPoorna-OpinionAudit/1.0'})
              with urllib.request.urlopen(req,timeout=20) as response:
                  data=response.read()
              image=Image.open(BytesIO(data)).convert('RGBA')
              image.save(f'/tmp/opinion-art/{stem}.png')
              print(stem, image.size)
          PY
      - name: Upload Opinion artwork
        uses: actions/upload-artifact@v4
        with:
          name: auditorium-opinion-art
          path: /tmp/opinion-art/*.png
          retention-days: 1
