name: Export Auditorium Navigation Art

on:
  push:
    branches:
      - cinema-rebuild
    paths:
      - '.github/auditorium-nav-art.trigger'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download approved navigation artwork
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nav-art
          python3 -m pip install --quiet pillow
          python3 <<'PY'
          from io import BytesIO
          import urllib.request
          from PIL import Image

          base='https://assets.moviereviewbypoorna.com/ui/pages/content/v4/responsive/'
          files={
              'top':'02_Movie_Reviews_By_Poorna_Banner_runtime_q99.webp',
              'bottom':'08_Lounge_Cini_Cafe_Banner_runtime_q99.webp',
          }
          for stem,name in files.items():
              req=urllib.request.Request(base+name,headers={'User-Agent':'MovieReviewByPoorna-NavAudit/1.0'})
              with urllib.request.urlopen(req,timeout=20) as response:
                  data=response.read()
              image=Image.open(BytesIO(data)).convert('RGBA')
              image.save(f'/tmp/nav-art/{stem}.png')
              print(stem, image.size)
          PY
      - name: Upload navigation artwork
        uses: actions/upload-artifact@v4
        with:
          name: auditorium-nav-art
          path: /tmp/nav-art/*.png
          retention-days: 1
