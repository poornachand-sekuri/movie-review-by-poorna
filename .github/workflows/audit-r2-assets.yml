name: Audit R2 Lounge Assets

on:
  push:
    branches: [cinema-rebuild]
    paths:
      - '.github/workflows/audit-r2-assets.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch current R2 PNG masters
        shell: bash
        run: |
          set -euo pipefail
          base='https://assets.moviereviewbypoorna.com/ui/pages/home/v4/responsive'
          files=(
            '01_Movie_Reviews_By_Poorna_Premier_Lounge_Background.png'
            '02_Movie_Reviews_By_Poorna_Banner.png'
            '03_Now_Reviewed_Panel.png'
            '04_Recent_Reviews_Panel.png'
            '05_Previously_Reviewed_Panel.png'
            '06_Share_Your_Opinion_Panel.png'
            '07_Lounge_Cini_Cafe_Banner.png'
            '08_Now_Reviewed_With_Exit.png'
            '09_Share_Your_Opinion_With_Exit.png'
          )
          mkdir -p /tmp/r2-source /tmp/r2-final
          for f in "${files[@]}"; do
            echo "=== FETCH $f ==="
            curl --fail --silent --show-error --location --retry 3 --retry-delay 1 \
              "$base/$f" -o "/tmp/r2-source/$f"
            stat -c 'bytes=%s' "/tmp/r2-source/$f"
            sha256sum "/tmp/r2-source/$f"
            file "/tmp/r2-source/$f"
          done

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check --quiet Pillow

      - name: Convert directly fetched R2 masters to pixel-exact lossless WebP
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from PIL import Image
          import hashlib, os, csv, zipfile

          src_dir = '/tmp/r2-source'
          out_dir = '/tmp/r2-final'
          assets = [
              ('01_Movie_Reviews_By_Poorna_Premier_Lounge_Background.png', '01_Movie_Reviews_By_Poorna_Premier_Lounge_Background_lossless.webp'),
              ('02_Movie_Reviews_By_Poorna_Banner.png', '02_Movie_Reviews_By_Poorna_Banner_lossless.webp'),
              ('03_Now_Reviewed_Panel.png', '03_Now_Reviewed_Panel_lossless.webp'),
              ('04_Recent_Reviews_Panel.png', '04_Recent_Reviews_Panel_lossless.webp'),
              ('05_Previously_Reviewed_Panel.png', '05_Previously_Reviewed_Panel_lossless.webp'),
              ('06_Share_Your_Opinion_Panel.png', '06_Share_Your_Opinion_Panel_lossless.webp'),
              ('07_Lounge_Cini_Cafe_Banner.png', '07_Lounge_Cini_Cafe_Banner_lossless.webp'),
              ('08_Now_Reviewed_With_Exit.png', '08_Now_Reviewed_With_Exit_lossless.webp'),
              ('09_Share_Your_Opinion_With_Exit.png', '09_Share_Your_Opinion_With_Exit_lossless.webp'),
          ]

          os.makedirs(out_dir, exist_ok=True)
          rows = []
          all_exact = True
          total_png = 0
          total_webp = 0

          def sha256(path):
              h = hashlib.sha256()
              with open(path, 'rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          for png_name, webp_name in assets:
              src = os.path.join(src_dir, png_name)
              dst = os.path.join(out_dir, webp_name)

              source = Image.open(src)
              source.load()
              original_mode = source.mode
              if original_mode not in ('RGB', 'RGBA'):
                  source = source.convert('RGBA')
                  original_mode = 'RGBA'

              source.save(dst, 'WEBP', lossless=True, method=6, exact=True)

              decoded = Image.open(dst)
              decoded.load()
              if decoded.mode != original_mode:
                  decoded = decoded.convert(original_mode)

              exact = (
                  source.size == decoded.size
                  and source.mode == decoded.mode
                  and source.tobytes() == decoded.tobytes()
              )
              all_exact = all_exact and exact

              png_bytes = os.path.getsize(src)
              webp_bytes = os.path.getsize(dst)
              total_png += png_bytes
              total_webp += webp_bytes

              rows.append({
                  'source_png': png_name,
                  'runtime_webp': webp_name,
                  'dimensions': f'{source.width}x{source.height}',
                  'mode': source.mode,
                  'source_png_bytes': png_bytes,
                  'runtime_webp_bytes': webp_bytes,
                  'reduction_percent': f'{(1 - webp_bytes / png_bytes) * 100:.2f}',
                  'pixel_exact_roundtrip': str(exact),
                  'source_png_sha256': sha256(src),
                  'runtime_webp_sha256': sha256(dst),
              })

              print(f'{png_name} -> {webp_name}: {source.size} {source.mode} exact={exact} PNG={png_bytes} WebP={webp_bytes}')

          if not all_exact:
              raise SystemExit('FAIL: one or more lossless WebP files are not pixel-exact on decode')

          manifest = os.path.join(out_dir, 'R2_PIXEL_EXACT_VALIDATION.csv')
          with open(manifest, 'w', newline='', encoding='utf-8') as f:
              writer = csv.DictWriter(f, fieldnames=rows[0].keys())
              writer.writeheader()
              writer.writerows(rows)

          report = os.path.join(out_dir, 'R2_PIXEL_EXACT_VALIDATION.txt')
          with open(report, 'w', encoding='utf-8') as f:
              f.write('Movie Review By Poorna — Direct R2 Master Validation\n')
              f.write('==================================================\n\n')
              f.write('All source PNGs in this package were downloaded directly from the current public R2 responsive folder during this workflow run.\n')
              f.write('Each WebP was encoded losslessly, decoded, and compared byte-for-byte at the pixel level against the fetched R2 PNG master.\n\n')
              for row in rows:
                  f.write(f"{row['source_png']}\n")
                  f.write(f"  {row['dimensions']} {row['mode']}\n")
                  f.write(f"  Pixel exact: {row['pixel_exact_roundtrip']}\n")
                  f.write(f"  R2 PNG SHA256: {row['source_png_sha256']}\n")
                  f.write(f"  WebP SHA256:   {row['runtime_webp_sha256']}\n")
                  f.write(f"  Size reduction: {row['reduction_percent']}%\n\n")
              f.write(f'Total R2 PNG bytes: {total_png}\n')
              f.write(f'Total lossless WebP bytes: {total_webp}\n')
              f.write(f'Overall reduction: {(1 - total_webp / total_png) * 100:.2f}%\n')
              f.write('FINAL RESULT: PASS — ALL 9 WEBP FILES ARE PIXEL-EXACT TO THE CURRENT R2 PNG MASTERS.\n')

          zip_path = os.path.join(out_dir, 'Movie_Review_By_Poorna_Lounge_R2_VERIFIED_Lossless_WebP.zip')
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED) as z:
              for _, webp_name in assets:
                  z.write(os.path.join(out_dir, webp_name), arcname=webp_name)
              z.write(manifest, arcname='R2_PIXEL_EXACT_VALIDATION.csv')
              z.write(report, arcname='R2_PIXEL_EXACT_VALIDATION.txt')

          print(f'FINAL_ZIP={zip_path}')
          print(f'ALL_PIXEL_EXACT={all_exact}')
          PY

      - name: Upload R2-verified runtime pack
        uses: actions/upload-artifact@v4
        with:
          name: Movie_Review_By_Poorna_Lounge_R2_VERIFIED_Lossless_WebP
          path: /tmp/r2-final/Movie_Review_By_Poorna_Lounge_R2_VERIFIED_Lossless_WebP.zip
          if-no-files-found: error
          compression-level: 0
