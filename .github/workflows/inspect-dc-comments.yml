name: Inspect DC Comments

on:
  push:
    branches:
      - cinema-rebuild
    paths:
      - '.github/workflows/inspect-dc-comments.yml'
      - '.github/inspect-dc-comments.trigger'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Inspect DC comment rows
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute movie-review-by-poorna-content --remote --json --command "SELECT id, target_type, target_id, author_name, body, status, created_at, approved_at FROM comments WHERE target_type='review' AND target_id='dc' ORDER BY id DESC LIMIT 20;" | tee /tmp/dc-comments.json
          echo '--- DC comment status counts ---'
          npx wrangler d1 execute movie-review-by-poorna-content --remote --json --command "SELECT status, COUNT(*) AS count FROM comments WHERE target_type='review' AND target_id='dc' GROUP BY status ORDER BY status;"
