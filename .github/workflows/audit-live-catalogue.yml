name: Audit Live Catalogue

on:
  push:
    branches:
      - cinema-rebuild

permissions:
  contents: read

concurrency:
  group: audit-live-catalogue-cinema-rebuild
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Compare live combined content with preserved base catalogue
        shell: bash
        run: |
          set -euo pipefail

          git fetch --no-tags --depth=1 origin main
          git show FETCH_HEAD:public/data/index.json > /tmp/base-reviews.json
          git show FETCH_HEAD:public/data/cast-crew.json > /tmp/base-credits.json

          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 2 \
            https://www.moviereviewbypoorna.com/data/index.json \
            --output /tmp/live-reviews.json

          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 2 \
            https://www.moviereviewbypoorna.com/data/cast-crew.json \
            --output /tmp/live-credits.json

          node <<'NODE'
          const fs = require('node:fs');

          const baseReviews = JSON.parse(fs.readFileSync('/tmp/base-reviews.json', 'utf8'));
          const liveReviews = JSON.parse(fs.readFileSync('/tmp/live-reviews.json', 'utf8'));
          const baseCredits = JSON.parse(fs.readFileSync('/tmp/base-credits.json', 'utf8'));
          const liveCredits = JSON.parse(fs.readFileSync('/tmp/live-credits.json', 'utf8'));

          if (!Array.isArray(baseReviews) || !Array.isArray(liveReviews)) {
            throw new TypeError('Both base and live review catalogues must be arrays.');
          }

          const bySlug = (items) => new Map(items.map((item) => [String(item.s || '').toLowerCase(), item]));
          const baseBySlug = bySlug(baseReviews);
          const liveBySlug = bySlug(liveReviews);

          const added = [...liveBySlug.keys()].filter((slug) => !baseBySlug.has(slug)).sort();
          const missing = [...baseBySlug.keys()].filter((slug) => !liveBySlug.has(slug)).sort();
          const changed = [];

          for (const [slug, live] of liveBySlug) {
            const base = baseBySlug.get(slug);
            if (!base) continue;

            const keys = [...new Set([...Object.keys(base), ...Object.keys(live)])].sort();
            const fields = keys.filter((key) => JSON.stringify(base[key]) !== JSON.stringify(live[key]));
            if (fields.length) changed.push({ slug, fields });
          }

          const baseCreditRecords = baseCredits.records || {};
          const liveCreditRecords = liveCredits.records || {};
          const creditSlugs = [...new Set([...Object.keys(baseCreditRecords), ...Object.keys(liveCreditRecords)])].sort();
          const changedCredits = creditSlugs.filter(
            (slug) => JSON.stringify(baseCreditRecords[slug] ?? null) !== JSON.stringify(liveCreditRecords[slug] ?? null),
          );

          console.log(JSON.stringify({
            baseReviewCount: baseReviews.length,
            liveReviewCount: liveReviews.length,
            addedReviewSlugs: added,
            missingReviewSlugs: missing,
            changedReviews: changed,
            changedCreditSlugs: changedCredits,
          }, null, 2));
          NODE
