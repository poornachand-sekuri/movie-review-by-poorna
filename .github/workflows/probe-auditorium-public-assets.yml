name: Probe Auditorium Public Assets

on:
  push:
    branches:
      - cinema-rebuild
    paths:
      - '.github/auditorium-public-probe.trigger'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read exact Auditorium runtime dimensions
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import concurrent.futures
          import struct
          import urllib.parse
          import urllib.request

          base = 'https://assets.moviereviewbypoorna.com/ui/pages/content/v4/' + 'res' + 'ponsive/'
          candidates = [
              '02_Movie_Reviews_By_Poorna_Banner_runtime_q99.webp',
              '03_Clapboard_Details_transparent_runtime_q99.webp',
              '04_Theater_Seats_Reactions_transparent_runtime_q99.webp',
              '05_Share_This_Review_transparent_runtime_q99.webp',
              '06_Related_Reviews_transparent_runtime_q99.webp',
              '07_Share_Your_Opinion_Panel_runtime_q99.webp',
              '08_Lounge_Cini_Cafe_Banner_runtime_q99.webp',
              '09_Theater_Focus_Overlay_transparent_runtime_q99.webp',
              '10_Share_Your_Opinion_With_Exit_runtime_q99.webp',
              '01_Auditorium_Background_runtime_q99.webp',
              '01_The_Auditorium_Background_runtime_q99.webp',
              '01_Theater_Background_runtime_q99.webp',
              '01_Theater_Ambiance_Background_runtime_q99.webp',
              '01_Auditorium_Ambiance_Background_runtime_q99.webp',
              '01_Theater_Auditorium_Background_runtime_q99.webp',
              '01_Auditorium_Theater_Background_runtime_q99.webp',
          ]

          def dims(data):
              if len(data) >= 16 and data[:4] == b'RIFF' and data[8:12] == b'WEBP':
                  p = 12
                  while p + 8 <= len(data):
                      kind = data[p:p+4]
                      size = struct.unpack('<I', data[p+4:p+8])[0]
                      chunk = data[p+8:p+8+size]
                      if kind == b'VP8X' and len(chunk) >= 10:
                          return (1 + int.from_bytes(chunk[4:7], 'little'), 1 + int.from_bytes(chunk[7:10], 'little'))
                      if kind == b'VP8 ' and len(chunk) >= 10 and chunk[3:6] == b'\x9d\x01\x2a':
                          return (struct.unpack('<H', chunk[6:8])[0] & 0x3fff, struct.unpack('<H', chunk[8:10])[0] & 0x3fff)
                      if kind == b'VP8L' and len(chunk) >= 5 and chunk[0] == 0x2f:
                          bits = int.from_bytes(chunk[1:5], 'little')
                          return ((bits & 0x3fff) + 1, ((bits >> 14) & 0x3fff) + 1)
                      p += 8 + size + (size & 1)
              return None

          def probe(name):
              req = urllib.request.Request(base + urllib.parse.quote(name), headers={'User-Agent':'MovieReviewByPoorna-AuditoriumAudit/1.0'})
              try:
                  with urllib.request.urlopen(req, timeout=6) as res:
                      if res.status != 200:
                          return None
                      data = res.read()
                      return name, dims(data), len(data), res.headers.get('content-type','')
              except Exception:
                  return None

          found=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=16) as pool:
              for result in pool.map(probe, candidates):
                  if result:
                      found.append(result)
          for name,size,byte_count,content_type in found:
              print(f"AUDITORIUM_PUBLIC_ASSET\t{name}\t{size[0]}x{size[1]}\t{byte_count}\t{content_type}")
          print(f'AUDITORIUM_PUBLIC_MATCH_COUNT={len(found)}')
          PY
