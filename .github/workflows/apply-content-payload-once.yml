name: Apply Content Payload Optimization Once

on:
  push:
    branches:
      - optimize/code-workflow-files
    paths:
      - .github/workflows/apply-content-payload-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout optimization branch
        uses: actions/checkout@v4
        with:
          ref: optimize/code-workflow-files
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply exact Content payload changes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'src/review-catalog.js',
              "export function compactReviews(reviews) {\n  return Array.isArray(reviews) ? reviews.map(compactReview) : [];\n}\n",
              "export function compactReviews(reviews) {\n  return Array.isArray(reviews) ? reviews.map(compactReview) : [];\n}\n\nexport function contentPayload(reviews, requestedSlug = '') {\n  const source = Array.isArray(reviews) ? reviews : [];\n  const active = source.find(review => review.s === requestedSlug) || source[0] || null;\n  return {\n    reviews: compactReviews(source),\n    active\n  };\n}\n"
          )

          replace_once(
              'src/admin-console.js',
              "const REVIEW_DATA_KEY = '_system/review-admin-v2.json';",
              "import { compactReviews, contentPayload } from './review-catalog.js';\n\nconst REVIEW_DATA_KEY = '_system/review-admin-v2.json';"
          )
          replace_once(
              'src/admin-console.js',
              "export async function handleDynamicData(request, env, url) {\n  if (request.method !== 'GET') return null;\n  if (url.pathname === '/data/index.json') {\n    const reviews = await getCombinedReviews(env, request.url, false);\n    return json(reviews);\n  }\n  if (url.pathname === '/data/cast-crew.json') {\n    return json(await getCombinedCastCrew(env, request.url));\n  }\n  return null;\n}",
              "export async function handleDynamicData(request, env, url) {\n  if (request.method !== 'GET') return null;\n  if (url.pathname === '/data/catalog.json') {\n    const reviews = await getCombinedReviews(env, request.url, false);\n    return json(compactReviews(reviews));\n  }\n  if (url.pathname === '/data/content.json') {\n    const reviews = await getCombinedReviews(env, request.url, false);\n    return json(contentPayload(reviews, url.searchParams.get('review') || ''));\n  }\n  if (url.pathname === '/data/index.json') {\n    const reviews = await getCombinedReviews(env, request.url, false);\n    return json(reviews);\n  }\n  if (url.pathname === '/data/cast-crew.json') {\n    return json(await getCombinedCastCrew(env, request.url));\n  }\n  return null;\n}"
          )

          replace_once(
              'src/worker-entry.js',
              "import {\n  adminIsAuthenticated,\n  getCombinedReviews\n} from './admin-console.js';\nimport { compactReviews } from './review-catalog.js';",
              "import { adminIsAuthenticated } from './admin-console.js';"
          )
          replace_once(
              'src/worker-entry.js',
              "\n    if (request.method === 'GET' && url.pathname === '/data/catalog.json') {\n      const reviews = await getCombinedReviews(runtime, request.url, true);\n      return json(compactReviews(reviews), 200, {\n        'x-mrp-catalog-mode': 'compact'\n      });\n    }\n",
              ""
          )

          replace_once(
              'assets/js/app.js',
              "function resolveSlug() {\n  const url = new URL(location.href);\n  const fromQuery = url.searchParams.get('review');\n  if (fromQuery && state.movieBySlug.has(fromQuery)) return fromQuery;\n\n  const pathSlug = location.pathname.split('/').filter(Boolean).at(-1);\n  if (pathSlug && state.movieBySlug.has(pathSlug)) return pathSlug;\n\n  return state.movies[0]?.s || null;\n}",
              "function requestedSlug() {\n  const url = new URL(location.href);\n  const fromQuery = url.searchParams.get('review');\n  if (fromQuery) return fromQuery;\n  return location.pathname.split('/').filter(Boolean).at(-1) || '';\n}"
          )
          replace_once(
              'assets/js/app.js',
              "async function loadData() {\n  const [moviesResponse, castResponse, rulesResponse] = await Promise.all([\n    fetch(`${CONFIG.dataBase}/index.json`),\n    fetch(`${CONFIG.dataBase}/cast-crew.json`),\n    fetch(`${CONFIG.dataBase}/related-review-rules.json`)\n  ]);\n  if (!moviesResponse.ok || !castResponse.ok || !rulesResponse.ok) {\n    throw new Error('Could not load review data.');\n  }\n  state.movies = await moviesResponse.json();\n  state.castCrew = await castResponse.json();\n  state.rules = await rulesResponse.json();\n  state.movieBySlug = new Map(state.movies.map(movie => [movie.s, movie]));\n}\n\nasync function init() {\n  setupNavigation();\n  setAsset($('#brandArtwork'), 'header');\n  try {\n    await loadData();\n    const slug = resolveSlug();\n    const movie = state.movieBySlug.get(slug) || state.movies[0];\n    if (!movie) throw new Error('No reviews were found.');\n    renderMovie(movie);",
              "async function loadData(slug) {\n  const contentUrl = new URL(`${CONFIG.dataBase}/content.json`, location.origin);\n  if (slug) contentUrl.searchParams.set('review', slug);\n\n  const [contentResponse, castResponse, rulesResponse] = await Promise.all([\n    fetch(contentUrl),\n    fetch(`${CONFIG.dataBase}/cast-crew.json`),\n    fetch(`${CONFIG.dataBase}/related-review-rules.json`)\n  ]);\n  if (!contentResponse.ok || !castResponse.ok || !rulesResponse.ok) {\n    throw new Error('Could not load review data.');\n  }\n\n  const payload = await contentResponse.json();\n  if (!Array.isArray(payload?.reviews) || !payload.active) {\n    throw new Error('Review data is incomplete.');\n  }\n\n  state.movies = payload.reviews;\n  state.activeMovie = payload.active;\n  state.castCrew = await castResponse.json();\n  state.rules = await rulesResponse.json();\n  state.movieBySlug = new Map(state.movies.map(movie => [movie.s, movie]));\n}\n\nasync function init() {\n  setupNavigation();\n  setAsset($('#brandArtwork'), 'header');\n  try {\n    const slug = requestedSlug();\n    await loadData(slug);\n    const movie = state.activeMovie || state.movieBySlug.get(slug) || state.movies[0];\n    if (!movie) throw new Error('No reviews were found.');\n    renderMovie(movie);"
          )

          replace_once(
              'wrangler.jsonc',
              '      "/api/*",\n      "/data/catalog.json",',
              '      "/api/*",\n      "/data/catalog.json",\n      "/data/content.json",'
          )

          replace_once(
              'scripts/validate-compact-catalog.mjs',
              "import {\n  COMPACT_REVIEW_FIELDS,\n  compactReviews\n} from '../src/review-catalog.js';",
              "import {\n  COMPACT_REVIEW_FIELDS,\n  compactReviews,\n  contentPayload\n} from '../src/review-catalog.js';"
          )
          replace_once(
              'scripts/validate-compact-catalog.mjs',
              "const full = JSON.parse(readFileSync(new URL('../public/data/index.json', import.meta.url), 'utf8'));\nconst compact = compactReviews(full);",
              "const full = JSON.parse(readFileSync(new URL('../public/data/index.json', import.meta.url), 'utf8'));\nconst compact = compactReviews(full);\nconst requested = full[Math.floor(full.length / 2)]?.s || '';\nconst content = contentPayload(full, requested);"
          )
          replace_once(
              'scripts/validate-compact-catalog.mjs',
              "const fullBytes = Buffer.byteLength(JSON.stringify(full));\nconst compactBytes = Buffer.byteLength(JSON.stringify(compact));\nconst reductionPercent = Number(((1 - compactBytes / fullBytes) * 100).toFixed(1));\n\nassert(\n  compactBytes < fullBytes * 0.75,\n  `Compact catalogue must reduce serialized payload by at least 25%; reduction was ${reductionPercent}%.`\n);",
              "assert.equal(content.reviews.length, full.length, 'Content payload must preserve every catalogue review.');\nassert.equal(content.active?.s, requested, 'Content payload must return the requested active review.');\nassert.equal(\n  content.active?.body,\n  full.find(review => review.s === requested)?.body,\n  'Content payload must preserve the active review body.'\n);\nassert(Array.isArray(content.active?.gallery), 'Content payload must preserve the active review gallery.');\n\nconst fullBytes = Buffer.byteLength(JSON.stringify(full));\nconst compactBytes = Buffer.byteLength(JSON.stringify(compact));\nconst contentBytes = Buffer.byteLength(JSON.stringify(content));\nconst reductionPercent = Number(((1 - compactBytes / fullBytes) * 100).toFixed(1));\nconst contentReductionPercent = Number(((1 - contentBytes / fullBytes) * 100).toFixed(1));\n\nassert(\n  compactBytes < fullBytes * 0.75,\n  `Compact catalogue must reduce serialized payload by at least 25%; reduction was ${reductionPercent}%.`\n);\nassert(\n  contentBytes < fullBytes * 0.75,\n  `Content payload must reduce serialized payload by at least 25%; reduction was ${contentReductionPercent}%.`\n);"
          )
          replace_once(
              'scripts/validate-compact-catalog.mjs',
              "const contentSource = readFileSync(new URL('../assets/js/app.js', import.meta.url), 'utf8');\nconst workerEntry = readFileSync(new URL('../src/worker-entry.js', import.meta.url), 'utf8');\nconst wrangler = readFileSync(new URL('../wrangler.jsonc', import.meta.url), 'utf8');",
              "const contentSource = readFileSync(new URL('../assets/js/app.js', import.meta.url), 'utf8');\nconst dynamicDataSource = readFileSync(new URL('../src/admin-console.js', import.meta.url), 'utf8');\nconst wrangler = readFileSync(new URL('../wrangler.jsonc', import.meta.url), 'utf8');"
          )
          replace_once(
              'scripts/validate-compact-catalog.mjs',
              "assert(\n  contentSource.includes('fetch(`${CONFIG.dataBase}/index.json`)'),\n  'Content pages must retain the full review endpoint.'\n);\nassert(workerEntry.includes(\"url.pathname === '/data/catalog.json'\"), 'Worker must serve the compact endpoint.');\nassert(wrangler.includes('\"/data/catalog.json\"'), 'Cloudflare must run the Worker first for the compact endpoint.');\n\nconsole.log(\n  `Compact catalogue: ${compact.length} reviews, ${fullBytes} -> ${compactBytes} bytes (${reductionPercent}% reduction).`\n);",
              "assert(\n  contentSource.includes('`${CONFIG.dataBase}/content.json`'),\n  'Content pages must use the optimized Content payload endpoint.'\n);\nassert(\n  !contentSource.includes('fetch(`${CONFIG.dataBase}/index.json`)'),\n  'Content pages must not download the full review catalogue directly.'\n);\nassert(dynamicDataSource.includes(\"url.pathname === '/data/catalog.json'\"), 'Worker must serve the compact endpoint.');\nassert(dynamicDataSource.includes(\"url.pathname === '/data/content.json'\"), 'Worker must serve the Content endpoint.');\nassert(wrangler.includes('\"/data/catalog.json\"'), 'Cloudflare must run the Worker first for the compact endpoint.');\nassert(wrangler.includes('\"/data/content.json\"'), 'Cloudflare must run the Worker first for the Content endpoint.');\n\nconsole.log(\n  `Compact catalogue: ${compact.length} reviews, ${fullBytes} -> ${compactBytes} bytes (${reductionPercent}% reduction).`\n);\nconsole.log(\n  `Content payload: ${fullBytes} -> ${contentBytes} bytes (${contentReductionPercent}% reduction for one active review).`\n);"
          )

          replace_once(
              'docs/OPTIMIZATION-AUDIT.md',
              '- Added a CI regression check that preserves review ordering and compact fields while enforcing a minimum 25% serialized-payload reduction.\n',
              '- Added a CI regression check that preserves review ordering and compact fields while enforcing a minimum 25% serialized-payload reduction.\n- Added a Content payload endpoint that combines the compact catalogue with only the requested review body/gallery, avoiding a full-catalogue body download on every Content page.\n- Centralized all public dynamic data endpoints in `handleDynamicData` instead of splitting catalogue routing across Worker entry points.\n'
          )
          replace_once(
              'docs/OPTIMIZATION-AUDIT.md',
              '- Home and Cine Cafe now consume `/data/catalog.json`, which contains only the fields needed for cards, search, ratings and Home POV content. Content pages continue using full `/data/index.json` so review-body HTML and galleries remain unchanged.\n',
              '- Home and Cine Cafe consume `/data/catalog.json`. Content pages consume `/data/content.json?review=<slug>`, which returns the same compact catalogue plus the complete body/gallery for only the requested review. The compatibility endpoint `/data/index.json` remains available for existing integrations and Admin-backed data assembly.\n'
          )

          replace_once(
              'docs/API-CONTRACT.md',
              "Production APIs are same-origin Cloudflare Worker routes under `/api`.\n\n## Reactions",
              "Production APIs are same-origin Cloudflare Worker routes under `/api`.\n\n## Public review data\n\n### GET `/data/catalog.json`\n\nReturns the dynamically combined base and Admin-managed review catalogue using only list/search fields. It intentionally excludes review-body HTML, galleries and Admin metadata. Home and Cine Cafe use this endpoint.\n\n### GET `/data/content.json?review=<movie-slug>`\n\nReturns `{ reviews, active }`, where `reviews` is the compact catalogue and `active` is the complete requested public review including body HTML and gallery. Unknown or missing slugs fall back to the latest review, matching the existing public-page behavior.\n\n### GET `/data/index.json`\n\nRetained as the full dynamically combined catalogue compatibility endpoint. Public Content pages no longer download this entire payload.\n\n## Reactions"
          )
          PY

      - name: Install deployment tooling
        run: npm install --no-audit --no-fund

      - name: Validate optimized branch
        run: |
          npm run check:js
          npx wrangler deploy --dry-run
          git diff --check

      - name: Commit optimization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/review-catalog.js src/admin-console.js src/worker-entry.js assets/js/app.js scripts/validate-compact-catalog.mjs wrangler.jsonc docs/OPTIMIZATION-AUDIT.md docs/API-CONTRACT.md
          git commit -m 'Reduce Content page review payload'
          git push origin HEAD:optimize/code-workflow-files
