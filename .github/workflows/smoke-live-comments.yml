name: Smoke Live Comments

on:
  push:
    branches:
      - main

jobs:
  live-comments:
    runs-on: ubuntu-latest
    steps:
      - name: Verify public comments API
        shell: bash
        run: |
          set -euo pipefail
          base='https://movie-review-by-poorna.poornarocks.workers.dev'

          check_target() {
            local label="$1"
            local target="$2"
            local target_id="$3"
            local file="$4"
            local url="$base/api/comments?target=$target&target_id=$target_id"
            local ready='false'

            for attempt in {1..12}; do
              status=$(curl -sS -o "$file" -w '%{http_code}' "$url" || true)
              if [ "$status" = '200' ] && node - "$file" <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (!Array.isArray(payload.comments)) process.exit(1);
          for (const comment of payload.comments) {
            for (const key of ['id', 'name', 'comment', 'created_at']) {
              if (typeof comment[key] !== 'string') process.exit(1);
            }
            if ('email' in comment || 'client_key' in comment) process.exit(1);
          }
          NODE
              then
                ready='true'
                break
              fi
              sleep 5
            done

            if [ "$ready" != 'true' ]; then
              echo "$label comments endpoint did not become ready with valid JSON"
              cat "$file" 2>/dev/null || true
              exit 1
            fi

            node - "$file" "$label" <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          console.log(`${process.argv[3]} comments OK: ${payload.comments.length} approved comment(s)`);
          NODE
          }

          check_target 'Review' 'review' 'dc' '/tmp/comments-review.json'
          check_target 'Home' 'home' 'home' '/tmp/comments-home.json'

          post_status=$(curl -sS -o /tmp/comment-post.json -w '%{http_code}' \
            -X POST "$base/api/comments" \
            -H "Origin: $base" \
            -H 'Content-Type: application/json' \
            --data '{"target":"home","target_id":"home","name":"Smoke Test","email":"smoke@example.com","comment":"Non-persistent honeypot probe","website":"bot-field"}')

          if [ "$post_status" != '202' ]; then
            echo "Non-persistent comments POST probe returned HTTP $post_status"
            cat /tmp/comment-post.json 2>/dev/null || true
            exit 1
          fi

          node - /tmp/comment-post.json <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (payload.status !== 'pending') throw new Error('Unexpected comments POST response');
          console.log('Live comments POST route OK (honeypot probe was not stored)');
          NODE
