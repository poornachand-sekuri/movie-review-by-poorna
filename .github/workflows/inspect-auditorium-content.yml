name: Inspect Auditorium Content Mapping

on:
  push:
    branches:
      - cinema-rebuild
    paths:
      - '.github/auditorium-content.trigger'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read live DC and related review payloads
        shell: bash
        run: |
          set -euo pipefail
          base='https://movie-review-by-poorna-preview.poornarocks.workers.dev'
          curl --fail --silent --show-error "$base/api/reviews/dc" > /tmp/dc.json
          curl --fail --silent --show-error "$base/api/reviews?limit=12&language=Telugu" > /tmp/related.json
          node <<'NODE'
          const fs = require('node:fs');
          const dc = JSON.parse(fs.readFileSync('/tmp/dc.json','utf8'));
          const list = JSON.parse(fs.readFileSync('/tmp/related.json','utf8'));
          const review = dc.review ?? dc;
          const summaries = list.reviews ?? list.items ?? list.results ?? list;
          const clean = {
            id: review.id,
            slug: review.slug,
            title: review.title,
            language: review.language,
            releaseDate: review.releaseDate,
            reviewedDate: review.reviewedDate,
            rating: review.rating,
            verdict: review.verdict,
            excerpt: review.excerpt,
            posterUrl: review.posterUrl,
            extra: review.extra,
            credits: review.credits,
            gallery: review.gallery,
            bodyLength: String(review.bodyHtml ?? '').length,
            bodyPreview: String(review.bodyHtml ?? '').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim().slice(0,500)
          };
          console.log('AUDITORIUM_DC=' + JSON.stringify(clean));
          console.log('AUDITORIUM_RELATED=' + JSON.stringify(Array.isArray(summaries) ? summaries.slice(0,12).map(r => ({slug:r.slug,title:r.title,language:r.language,rating:r.rating,posterUrl:r.posterUrl,reviewedDate:r.reviewedDate})) : summaries));
          NODE
