name: Deploy Preview

on:
  workflow_dispatch:
    inputs:
      extended_checks:
        description: 'Run full live diagnostics (shared production D1 quota and test votes)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: movie-review-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate application
        run: npm run validate

      - name: Build preview application
        run: npm run build:preview

      - name: Deploy preview Worker
        run: node scripts/cloudflare.mjs preview deploy

      - name: Check service health and one compact review
        run: node scripts/check-deployment.mjs https://movie-review-by-poorna-preview.poornarocks.workers.dev preview

      - name: Smoke-test all four pages and APIs
        if: inputs.extended_checks == true
        run: npm run smoke -- https://movie-review-by-poorna-preview.poornarocks.workers.dev preview
