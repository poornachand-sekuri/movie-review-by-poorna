name: Deploy Preview

on:
  workflow_dispatch:
  push:
    branches:
      - cinema-rebuild
    paths:
      - '.github/preview.trigger'

permissions:
  contents: read

concurrency:
  group: movie-review-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate application
        run: |
          npm run check:guardrails
          node --test scripts/check-lounge-loading.mjs
          npm run check

      - name: Build application
        run: npm run build

      - name: Deploy temporary preview Worker
        id: deploy
        shell: bash
        run: |
          set -euo pipefail

          npx wrangler deploy 2>&1 | tee /tmp/deploy.log

          preview_url=$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/deploy.log | tail -n 1 || true)
          test -n "$preview_url" || { echo 'Could not determine workers.dev preview URL.'; exit 1; }

          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $preview_url"

      - name: Smoke-test live D1 APIs
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
        run: |
          set -euo pipefail

          fetch_json() {
            local label="$1"
            local path="$2"
            local output="$3"

            echo "Checking $label: $PREVIEW_URL$path"
            curl --fail --silent --show-error \
              --retry 10 --retry-delay 2 --retry-all-errors \
              "$PREVIEW_URL$path" > "$output"
          }

          sleep 3
          fetch_json 'health' '/api/health' /tmp/health.json
          fetch_json 'compact review list' '/api/reviews?limit=5' /tmp/reviews.json
          fetch_json 'review detail' '/api/reviews/dc' /tmp/detail.json
          fetch_json 'full-text search' '/api/search?q=Kantara&limit=5' /tmp/search.json

          node <<'NODE'
          const fs = require('node:fs');

          const health = JSON.parse(fs.readFileSync('/tmp/health.json', 'utf8'));
          const list = JSON.parse(fs.readFileSync('/tmp/reviews.json', 'utf8'));
          const detail = JSON.parse(fs.readFileSync('/tmp/detail.json', 'utf8'));
          const search = JSON.parse(fs.readFileSync('/tmp/search.json', 'utf8'));

          if (health.status !== 'ok') throw new Error('Health endpoint failed.');
          if (!Array.isArray(list.items) || list.items.length !== 5) throw new Error('Review list did not return 5 rows.');
          if (Object.hasOwn(list.items[0], 'bodyHtml')) throw new Error('Compact review list leaked full review body.');
          if (detail.review?.slug !== 'dc') throw new Error('Review detail lookup failed for dc.');
          if (typeof detail.review?.bodyHtml !== 'string' || detail.review.bodyHtml.length === 0) throw new Error('Review detail body is missing.');
          if (!Array.isArray(detail.review?.credits)) throw new Error('Review credits are missing.');
          if (!Array.isArray(search.items) || !search.items.some((item) => item.slug === 'kantara-chapter-1')) {
            throw new Error('FTS search did not return Kantara: Chapter 1.');
          }

          console.log(`API smoke tests passed. Preview: ${process.env.PREVIEW_URL}`);
          console.log(`Compact list: ${list.items.length} rows; detail: ${detail.review.title}; search: ${search.items.length} result(s).`);
          NODE

      - name: Smoke-test Lounge pages and Premier artwork
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
        run: |
          set -euo pipefail

          curl --fail --silent --show-error --retry 6 --retry-delay 2 --retry-all-errors "$PREVIEW_URL/" > /tmp/lounge.html
          curl --fail --silent --show-error --retry 6 --retry-delay 2 --retry-all-errors "$PREVIEW_URL/search?q=Kantara" > /tmp/cafe.html
          curl --fail --silent --show-error --retry 6 --retry-delay 2 --retry-all-errors "$PREVIEW_URL/review/dc" > /tmp/review.html

          asset_base='https://assets.moviereviewbypoorna.com/ui/pages/home/v4/res''ponsive'

          background_file=''
          for candidate in \
            01_Movie_Reviews_By_Poorna_Premier_Lounge_Background_4K.png \
            01_Movie_Reviews_By_Poorna_Premier_Lounge_Background.png \
            01_Movie_Reviews_By_Poorna_Premier_Lounge_Background_4k.png \
            01_Movie_Reviews_By_Poorna_Premier_Lounge_Background_HD.png \
            01_Movie_Reviews_By_Poorna_Premier_Lounge_Background_2160x3780.png
          do
            status=$(curl --silent --show-error --location --output /tmp/lounge-background-candidate --write-out '%{http_code}' "$asset_base/$candidate?verify=$GITHUB_SHA" || true)
            echo "Background candidate $candidate -> HTTP $status"
            if [ "$status" = '200' ] && file /tmp/lounge-background-candidate | grep -q 'PNG image data'; then
              background_file="$candidate"
              cp /tmp/lounge-background-candidate /tmp/lounge-background.png
              break
            fi
          done
          test -n "$background_file" || { echo 'Could not resolve the uploaded Premier Lounge background object name.'; exit 1; }
          echo "Resolved Premier Lounge background: $background_file"

          for file in \
            02_Movie_Reviews_By_Poorna_Banner.png \
            03_Now_Reviewed_Panel.png \
            04_Recent_Reviews_Panel.png \
            05_Previously_Reviewed_Panel.png \
            06_Share_Your_Opinion_Panel.png \
            07_Lounge_Cini_Cafe_Banner.png
          do
            echo "Checking Premier artwork: $file"
            output="/tmp/$file"
            curl --fail --silent --show-error --location --retry 4 --retry-delay 1 --retry-all-errors \
              --output "$output" "$asset_base/$file?verify=$GITHUB_SHA"
            file "$output" | grep -q 'PNG image data' || {
              echo "Artwork payload is not a real PNG: $file"
              file "$output"
              exit 1
            }
          done

          node <<'NODE'
          const fs = require('node:fs');
          const lounge = fs.readFileSync('/tmp/lounge.html', 'utf8');
          const cafe = fs.readFileSync('/tmp/cafe.html', 'utf8');
          const review = fs.readFileSync('/tmp/review.html', 'utf8');

          const count = (html, token) => html.split(token).length - 1;

          if (!lounge.includes('Movie Reviews By Poorna')) throw new Error('Lounge title is missing.');
          if (!lounge.includes('lounge-stage')) throw new Error('Premier Lounge stage is missing.');
          if (!lounge.includes('data-lounge-loader') || !lounge.includes('Opening The Lobby')) throw new Error('Lounge loading screen is missing.');
          if (!lounge.includes('lounge-panel--now')) throw new Error('Now Reviewed panel is missing.');
          if (!lounge.includes('lounge-panel--recent')) throw new Error('Recent Reviews panel is missing.');
          if (!lounge.includes('lounge-panel--previous')) throw new Error('Previously Reviewed panel is missing.');
          if (!lounge.includes('lounge-panel--opinion')) throw new Error('Share Your Opinion panel is missing.');
          if (count(lounge, 'class="recent-card ') !== 8) throw new Error('Lounge did not render exactly 8 recent review cards.');
          if (count(lounge, 'class="previous-card ') !== 8) throw new Error('Lounge did not render exactly 8 previous review cards.');
          if (count(lounge, 'data-review-carousel') !== 2) throw new Error('Lounge did not render both review carousels.');
          if (count(lounge, 'data-carousel-next') !== 2 || count(lounge, 'data-carousel-prev') !== 2) {
            throw new Error('Lounge carousel side controls are missing.');
          }
          if (!lounge.includes('name="robots" content="noindex,nofollow"')) throw new Error('Preview noindex metadata is missing.');
          if (!cafe.includes('Kantara')) throw new Error('Cini Cafe search page did not render search results.');
          if (!review.includes('Screening Room') || !review.includes('DC')) throw new Error('Review click-through did not render DC.');

          console.log('Live page smoke tests passed: Premier Lounge artwork, review paging, Cini Cafe and review click-through.');
          NODE
