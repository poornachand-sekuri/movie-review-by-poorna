name: Deploy Preview

on:
  workflow_dispatch:
  push:
    branches:
      - cinema-rebuild
    paths:
      - '.github/preview.trigger'

permissions:
  contents: read

concurrency:
  group: movie-review-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate application
        run: |
          npm run check:guardrails
          npm run check

      - name: Build application
        run: npm run build

      - name: Deploy temporary preview Worker
        id: deploy
        shell: bash
        run: |
          set -euo pipefail

          npx wrangler deploy 2>&1 | tee /tmp/deploy.log

          preview_url=$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/deploy.log | tail -n 1 || true)
          test -n "$preview_url" || { echo 'Could not determine workers.dev preview URL.'; exit 1; }

          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $preview_url"

      - name: Smoke-test live D1 APIs
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
        run: |
          set -euo pipefail

          fetch_json() {
            local label="$1"
            local path="$2"
            local output="$3"

            echo "Checking $label: $PREVIEW_URL$path"
            curl --fail --silent --show-error \
              --retry 10 --retry-delay 2 --retry-all-errors \
              "$PREVIEW_URL$path" > "$output"
          }

          sleep 3
          fetch_json 'health' '/api/health' /tmp/health.json
          fetch_json 'compact review list' '/api/reviews?limit=5' /tmp/reviews.json
          fetch_json 'review detail' '/api/reviews/dc' /tmp/detail.json
          fetch_json 'full-text search' '/api/search?q=Kantara&limit=5' /tmp/search.json

          node <<'NODE'
          const fs = require('node:fs');

          const health = JSON.parse(fs.readFileSync('/tmp/health.json', 'utf8'));
          const list = JSON.parse(fs.readFileSync('/tmp/reviews.json', 'utf8'));
          const detail = JSON.parse(fs.readFileSync('/tmp/detail.json', 'utf8'));
          const search = JSON.parse(fs.readFileSync('/tmp/search.json', 'utf8'));

          if (health.status !== 'ok') throw new Error('Health endpoint failed.');
          if (!Array.isArray(list.items) || list.items.length !== 5) throw new Error('Review list did not return 5 rows.');
          if (Object.hasOwn(list.items[0], 'bodyHtml')) throw new Error('Compact review list leaked full review body.');
          if (detail.review?.slug !== 'dc') throw new Error('Review detail lookup failed for dc.');
          if (typeof detail.review?.bodyHtml !== 'string' || detail.review.bodyHtml.length === 0) throw new Error('Review detail body is missing.');
          if (!Array.isArray(detail.review?.credits)) throw new Error('Review credits are missing.');
          if (!Array.isArray(search.items) || !search.items.some((item) => item.slug === 'kantara-chapter-1')) {
            throw new Error('FTS search did not return Kantara: Chapter 1.');
          }

          console.log(`API smoke tests passed. Preview: ${process.env.PREVIEW_URL}`);
          console.log(`Compact list: ${list.items.length} rows; detail: ${detail.review.title}; search: ${search.items.length} result(s).`);
          NODE

      - name: Smoke-test Lounge pages and artwork
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
        run: |
          set -euo pipefail

          curl --fail --silent --show-error --retry 6 --retry-delay 2 --retry-all-errors "$PREVIEW_URL/" > /tmp/lounge.html
          curl --fail --silent --show-error --retry 6 --retry-delay 2 --retry-all-errors "$PREVIEW_URL/search?q=Kantara" > /tmp/cafe.html
          curl --fail --silent --show-error --retry 6 --retry-delay 2 --retry-all-errors "$PREVIEW_URL/review/dc" > /tmp/review.html

          asset_base='https://assets.moviereviewbypoorna.com/ui/pages/home/v4/res''ponsive'
          for file in \
            01_background.avif \
            02_top_menu_section.avif \
            03_now_reviewed_section.avif \
            04_recent_reviews_section.avif \
            05_previously_reviewed.avif \
            06_share_your_opinion.avif \
            07_bottom_navigation.avif
          do
            echo "Checking artwork: $file"
            curl --fail --silent --show-error --location --retry 4 --retry-delay 1 --retry-all-errors \
              --output /dev/null "$asset_base/$file"
          done

          node <<'NODE'
          const fs = require('node:fs');
          const lounge = fs.readFileSync('/tmp/lounge.html', 'utf8');
          const cafe = fs.readFileSync('/tmp/cafe.html', 'utf8');
          const review = fs.readFileSync('/tmp/review.html', 'utf8');

          const count = (html, token) => html.split(token).length - 1;

          if (!lounge.includes('Movie Reviews By Poorna')) throw new Error('Lounge title is missing.');
          if (!lounge.includes('03_now_reviewed_section.avif')) throw new Error('Now Reviewed artwork is missing.');
          if (!lounge.includes('04_recent_reviews_section.avif')) throw new Error('Recent Reviews artwork is missing.');
          if (!lounge.includes('05_previously_reviewed.avif')) throw new Error('Previous Reviews artwork is missing.');
          if (!lounge.includes('06_share_your_opinion.avif')) throw new Error('Opinion artwork is missing.');
          if (count(lounge, 'class="recent-card ') !== 4) throw new Error('Lounge did not render exactly 4 recent review cards.');
          if (count(lounge, 'class="previous-card ') !== 4) throw new Error('Lounge did not render exactly 4 previous review cards.');
          if (!lounge.includes('name="robots" content="noindex,nofollow"')) throw new Error('Preview noindex metadata is missing.');
          if (!cafe.includes('Kantara')) throw new Error('Cini Cafe search page did not render search results.');
          if (!review.includes('Screening Room') || !review.includes('DC')) throw new Error('Review click-through did not render DC.');

          console.log('Live page smoke tests passed: Lounge, artwork, Cini Cafe and review click-through.');
          NODE
