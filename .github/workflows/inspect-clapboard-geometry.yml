name: Inspect Clapboard Geometry

on:
  push:
    branches:
      - cinema-rebuild
    paths:
      - '.github/clapboard-geometry.trigger'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Measure source artwork geometry
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow opencv-python-headless numpy
          python3 <<'PY'
          from io import BytesIO
          import urllib.request
          import cv2, numpy as np
          from PIL import Image

          url='https://assets.moviereviewbypoorna.com/ui/pages/content/v4/responsive/03_Clapboard_Details_transparent_runtime_q99.webp'
          req=urllib.request.Request(url,headers={'User-Agent':'MovieReviewByPoorna-Geometry/3.0'})
          with urllib.request.urlopen(req, timeout=20) as r:
              data=r.read()
          rgba=np.array(Image.open(BytesIO(data)).convert('RGBA'))
          rgb=rgba[...,:3]
          alpha=rgba[...,3]
          h,w=rgb.shape[:2]
          print(f'CANVAS\t{w}\t{h}')

          hsv=cv2.cvtColor(rgb, cv2.COLOR_RGB2HSV)
          red=((((hsv[:,:,0] <= 10) | (hsv[:,:,0] >= 170)) & (hsv[:,:,1] >= 130) & (hsv[:,:,2] >= 110) & (alpha >= 32))).astype(np.uint8)

          print('POSTER_INNER\tleft=75\ttop=164\tright=553\tbottom=492\twidth=479\theight=329')
          meta=[('watched',253.000),('release',351.500),('rating',446.000)]
          for name,cy in meta:
              print(f'META_CENTER\t{name}\t{cy:.3f}')

          warm=((hsv[:,:,0] >= 8) & (hsv[:,:,0] <= 35) & (hsv[:,:,1] >= 35) & (hsv[:,:,1] <= 190) & (hsv[:,:,2] >= 120) & (alpha>=32)).astype(np.uint8)
          credit_bands=[('actor',599,617,607.877),('actress',646,663,654.438),('director',692,710,700.396),('music',740,758,748.993)]
          for name,y0,y1,cy in credit_bands:
              print(f'CREDIT_CENTER\t{name}\t{cy:.3f}')
              # Restrict to the right side of the baked label where only the colon should live.
              roi=warm[y0:y1+1, 280:560]
              n,labels,stats,cent=cv2.connectedComponentsWithStats(roi,8)
              comps=[]
              for i in range(1,n):
                  x,y,cw,ch,area=map(int,stats[i])
                  if area>=2:
                      comps.append((area,x+280,y+y0,cw,ch,float(cent[i][0]+280),float(cent[i][1]+y0)))
              for comp in sorted(comps, key=lambda r:r[1]):
                  print('CREDIT_RIGHT_COMPONENT\t'+name+'\t'+'\t'.join(map(str,comp)))
              ys,xs=np.nonzero(roi)
              if len(xs):
                  print(f'CREDIT_RIGHT_RANGE\t{name}\tmin_x={int(xs.min()+280)}\tmax_x={int(xs.max()+280)}')

          # Also inspect all opaque/warm-ish tiny punctuation candidates between x 300..450.
          # Colons have two small vertically separated blobs at nearly the same x.
          punct=((hsv[:,:,0] >= 5) & (hsv[:,:,0] <= 45) & (hsv[:,:,1] >= 20) & (hsv[:,:,2] >= 100) & (alpha>=32)).astype(np.uint8)
          for name,y0,y1,cy in credit_bands:
              roi=punct[y0:y1+1,300:460]
              col=roi.sum(axis=0)
              for ix in np.argsort(col)[-12:][::-1]:
                  if col[ix]>=2:
                      print(f'PUNCT_COL\t{name}\tx={int(ix+300)}\tpixels={int(col[ix])}')
          PY
