name: Inspect Clapboard Geometry

on:
  push:
    branches:
      - cinema-rebuild
    paths:
      - '.github/clapboard-geometry.trigger'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Measure source artwork geometry
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow opencv-python-headless numpy
          python3 <<'PY'
          from io import BytesIO
          import urllib.request
          import cv2, numpy as np
          from PIL import Image

          url='https://assets.moviereviewbypoorna.com/ui/pages/content/v4/responsive/03_Clapboard_Details_transparent_runtime_q99.webp'
          req=urllib.request.Request(url,headers={'User-Agent':'MovieReviewByPoorna-Geometry/5.0'})
          with urllib.request.urlopen(req, timeout=20) as r:
              data=r.read()
          rgba=np.array(Image.open(BytesIO(data)).convert('RGBA'))
          rgb=rgba[...,:3]
          alpha=rgba[...,3]
          hsv=cv2.cvtColor(rgb, cv2.COLOR_RGB2HSV)

          print('CANVAS\t1536\t1024')
          print('POSTER_INNER\tleft=75\ttop=164\tright=553\tbottom=492\twidth=479\theight=329')
          print('META_CENTER\twatched\t253.000')
          print('META_CENTER\trelease\t351.500')
          print('META_CENTER\trating\t446.000')

          credit_bands=[('actor',596,620,607.877),('actress',643,666,654.438),('director',689,713,700.396),('music',737,761,748.993)]
          # Colon is intentionally dimmer than the cream labels. Inspect only its measured x neighborhood.
          for name,y0,y1,cy in credit_bands:
              print(f'CREDIT_CENTER\t{name}\t{cy:.3f}')
              roi_v=hsv[y0:y1+1,340:410,2]
              roi_a=alpha[y0:y1+1,340:410]
              # Anything meaningfully above the black background and non-transparent.
              mask=((roi_v >= 32) & (roi_a >= 24)).astype(np.uint8)
              n,labels,stats,cent=cv2.connectedComponentsWithStats(mask,8)
              comps=[]
              for i in range(1,n):
                  x,y,cw,ch,area=map(int,stats[i])
                  if 2 <= area <= 180 and cw <= 24 and ch <= 24:
                      comps.append((area,x+340,y+y0,cw,ch,float(cent[i][0]+340),float(cent[i][1]+y0)))
              for comp in sorted(comps,key=lambda r:(r[1],r[2])):
                  print('DARK_COLON_COMPONENT\t'+name+'\t'+'\t'.join(map(str,comp)))
              col=mask.sum(axis=0)
              for ix in np.argsort(col)[-12:][::-1]:
                  if col[ix]>=2:
                      print(f'DARK_COLON_COL\t{name}\tx={int(ix+340)}\tpixels={int(col[ix])}')
          PY
