name: Inspect Clapboard Geometry

on:
  push:
    branches:
      - cinema-rebuild
    paths:
      - '.github/clapboard-geometry.trigger'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Measure source artwork geometry
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow opencv-python-headless numpy
          python3 <<'PY'
          from io import BytesIO
          import urllib.request
          import cv2, numpy as np
          from PIL import Image

          url='https://assets.moviereviewbypoorna.com/ui/pages/content/v4/responsive/03_Clapboard_Details_transparent_runtime_q99.webp'
          req=urllib.request.Request(url,headers={'User-Agent':'MovieReviewByPoorna-Geometry/2.0'})
          with urllib.request.urlopen(req, timeout=20) as r:
              data=r.read()
          rgba=np.array(Image.open(BytesIO(data)).convert('RGBA'))
          rgb=rgba[...,:3]
          alpha=rgba[...,3]
          h,w=rgb.shape[:2]
          print(f'CANVAS\t{w}\t{h}')

          hsv=cv2.cvtColor(rgb, cv2.COLOR_RGB2HSV)
          red=((((hsv[:,:,0] <= 10) | (hsv[:,:,0] >= 170)) & (hsv[:,:,1] >= 130) & (hsv[:,:,2] >= 110) & (alpha >= 32))).astype(np.uint8)

          # Exact red poster frame region, already isolated by the first pass.
          x0,y0,x1,y1 = 60,145,575,515
          pr=red[y0:y1, x0:x1]
          row=pr.sum(axis=1)
          col=pr.sum(axis=0)
          print('POSTER_FRAME_REGION\t60\t145\t575\t515')
          for y in np.argsort(row)[-35:][::-1]:
              if row[y] >= 20:
                  print(f'POSTER_RED_ROW\t{int(y+y0)}\t{int(row[y])}')
          for x in np.argsort(col)[-35:][::-1]:
              if col[x] >= 20:
                  print(f'POSTER_RED_COL\t{int(x+x0)}\t{int(col[x])}')

          # Find long near-horizontal/vertical red runs to infer inner opening.
          def longest_run(line):
              idx=np.flatnonzero(line)
              if len(idx)==0: return None
              best=(idx[0],idx[0]); start=prev=idx[0]
              for v in idx[1:]:
                  if v==prev+1:
                      prev=v
                  else:
                      if prev-start > best[1]-best[0]: best=(start,prev)
                      start=prev=v
              if prev-start > best[1]-best[0]: best=(start,prev)
              return best

          for sy in range(150,505):
              run=longest_run(red[sy,60:575])
              if run and run[1]-run[0]+1 >= 250:
                  print(f'POSTER_HRUN\t{sy}\t{run[0]+60}\t{run[1]+60}\t{run[1]-run[0]+1}')
          for sx in range(60,575):
              run=longest_run(red[145:515,sx])
              if run and run[1]-run[0]+1 >= 160:
                  print(f'POSTER_VRUN\t{sx}\t{run[0]+145}\t{run[1]+145}\t{run[1]-run[0]+1}')

          # Metadata row centers from their distinct red icon components.
          meta=[('watched',600,220,68,66),('release',602,320,64,63),('rating',598,410,73,72)]
          for name,x,y,cw,ch in meta:
              print(f'META_ROW\t{name}\tcenter_y={y+ch/2:.3f}\ticon_x={x}\ticon_y={y}\ticon_w={cw}\ticon_h={ch}')

          # Warm label pixels, restricted to Cast & Crew label zone.
          warm=((hsv[:,:,0] >= 8) & (hsv[:,:,0] <= 35) & (hsv[:,:,1] >= 35) & (hsv[:,:,1] <= 190) & (hsv[:,:,2] >= 120) & (alpha>=32)).astype(np.uint8)
          zone=warm[570:775,130:560]
          # For each y, count warm label pixels in the label/colon zone.
          row_counts=zone.sum(axis=1)
          # Group consecutive rows with non-trivial activity into text-line bands.
          active=np.flatnonzero(row_counts>=8)
          bands=[]
          if len(active):
              s=p=active[0]
              for yy in active[1:]:
                  if yy<=p+2:
                      p=yy
                  else:
                      bands.append((s,p)); s=p=yy
              bands.append((s,p))
          for s,e in bands:
              if e-s+1>=3:
                  weights=row_counts[s:e+1].astype(float)
                  ys=np.arange(s,e+1)+570
                  center=float((ys*weights).sum()/weights.sum()) if weights.sum() else (s+e)/2+570
                  print(f'CREDIT_BAND\t{s+570}\t{e+570}\tcenter_y={center:.3f}\tpixels={int(weights.sum())}')

          # Column activity near the baked colons, to locate where runtime values should begin.
          credit=warm[585:765,130:500]
          c=credit.sum(axis=0)
          for x in np.argsort(c)[-45:][::-1]:
              if c[x]>=8:
                  print(f'CREDIT_COL\t{x+130}\t{int(c[x])}')
          PY
