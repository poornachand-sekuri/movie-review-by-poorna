name: Audit Auditorium R2 Assets

on:
  push:
    branches:
      - cinema-rebuild
    paths:
      - '.github/auditorium-assets.trigger'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Build temporary R2 audit Worker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/auditorium-audit
          cat > /tmp/auditorium-audit/wrangler.jsonc <<'JSON'
          {
            "name": "movie-review-auditorium-asset-audit",
            "main": "worker.mjs",
            "compatibility_date": "2026-09-06",
            "workers_dev": true,
            "r2_buckets": [
              {
                "binding": "AUDITORIUM_ASSETS",
                "bucket_name": "movie-review-assets"
              }
            ]
          }
          JSON

          cat > /tmp/auditorium-audit/worker.mjs <<'JS'
          function readU16LE(bytes, offset) {
            return bytes[offset] | (bytes[offset + 1] << 8);
          }

          function readU32LE(bytes, offset) {
            return (bytes[offset] | (bytes[offset + 1] << 8) | (bytes[offset + 2] << 16) | (bytes[offset + 3] << 24)) >>> 0;
          }

          function readU32BE(bytes, offset) {
            return (((bytes[offset] << 24) >>> 0) | (bytes[offset + 1] << 16) | (bytes[offset + 2] << 8) | bytes[offset + 3]) >>> 0;
          }

          function ascii(bytes, start, length) {
            return String.fromCharCode(...bytes.slice(start, start + length));
          }

          function dimensions(bytes) {
            if (bytes.length >= 24 && bytes[0] === 0x89 && ascii(bytes, 1, 3) === 'PNG') {
              return { width: readU32BE(bytes, 16), height: readU32BE(bytes, 20) };
            }

            if (bytes.length >= 16 && ascii(bytes, 0, 4) === 'RIFF' && ascii(bytes, 8, 4) === 'WEBP') {
              let p = 12;
              while (p + 8 <= bytes.length) {
                const kind = ascii(bytes, p, 4);
                const length = readU32LE(bytes, p + 4);
                const start = p + 8;
                if (kind === 'VP8X' && start + 10 <= bytes.length) {
                  const width = 1 + bytes[start + 4] + (bytes[start + 5] << 8) + (bytes[start + 6] << 16);
                  const height = 1 + bytes[start + 7] + (bytes[start + 8] << 8) + (bytes[start + 9] << 16);
                  return { width, height };
                }
                if (kind === 'VP8 ' && start + 10 <= bytes.length && bytes[start + 3] === 0x9d && bytes[start + 4] === 0x01 && bytes[start + 5] === 0x2a) {
                  return { width: readU16LE(bytes, start + 6) & 0x3fff, height: readU16LE(bytes, start + 8) & 0x3fff };
                }
                if (kind === 'VP8L' && start + 5 <= bytes.length && bytes[start] === 0x2f) {
                  const bits = readU32LE(bytes, start + 1);
                  return { width: (bits & 0x3fff) + 1, height: ((bits >>> 14) & 0x3fff) + 1 };
                }
                p += 8 + length + (length & 1);
              }
            }

            for (let p = 4; p + 12 <= bytes.length; p += 1) {
              if (ascii(bytes, p, 4) === 'ispe') {
                return { width: readU32BE(bytes, p + 4), height: readU32BE(bytes, p + 8) };
              }
            }

            if (bytes.length > 4 && bytes[0] === 0xff && bytes[1] === 0xd8) {
              let p = 2;
              while (p + 9 < bytes.length) {
                if (bytes[p] !== 0xff) { p += 1; continue; }
                const marker = bytes[p + 1];
                const length = (bytes[p + 2] << 8) | bytes[p + 3];
                if ([0xc0,0xc1,0xc2,0xc3,0xc5,0xc6,0xc7,0xc9,0xca,0xcb,0xcd,0xce,0xcf].includes(marker)) {
                  return { height: (bytes[p + 5] << 8) | bytes[p + 6], width: (bytes[p + 7] << 8) | bytes[p + 8] };
                }
                p += 2 + Math.max(length, 2);
              }
            }
            return null;
          }

          export default {
            async fetch(request, env) {
              const url = new URL(request.url);
              if (url.pathname !== '/audit') return new Response('Not found', { status: 404 });

              const prefix = 'ui/pages/content/v4/' + 'res' + 'ponsive/';
              const listed = await env.AUDITORIUM_ASSETS.list({ prefix, limit: 1000, include: ['httpMetadata', 'customMetadata'] });
              const rows = [];

              for (const item of listed.objects) {
                let size = null;
                if (/\.(?:png|webp|avif|jpe?g)$/i.test(item.key)) {
                  const object = await env.AUDITORIUM_ASSETS.get(item.key);
                  if (object) {
                    const bytes = new Uint8Array(await object.arrayBuffer());
                    size = dimensions(bytes);
                  }
                }
                rows.push({
                  key: item.key,
                  bytes: item.size,
                  contentType: item.httpMetadata?.contentType ?? null,
                  width: size?.width ?? null,
                  height: size?.height ?? null
                });
              }

              return Response.json({ prefix, truncated: listed.truncated, objects: rows }, { headers: { 'cache-control': 'no-store' } });
            }
          };
          JS

      - name: Deploy temporary audit Worker
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/auditorium-audit
          npx --yes wrangler@4.127.1 deploy 2>&1 | tee /tmp/auditorium-deploy.log
          url=$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/auditorium-deploy.log | tail -n 1 || true)
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Print exact Auditorium asset inventory
        shell: bash
        env:
          AUDIT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          sleep 2
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "$AUDIT_URL/audit" > /tmp/auditorium-assets.json
          node <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/auditorium-assets.json', 'utf8'));
          console.log(`AUDITORIUM_PREFIX=${payload.prefix}`);
          console.log(`AUDITORIUM_OBJECT_COUNT=${payload.objects.length}`);
          for (const item of payload.objects) {
            console.log(`AUDITORIUM_ASSET\t${item.key}\t${item.width ?? '?'}x${item.height ?? '?'}\t${item.bytes}\t${item.contentType ?? ''}`);
          }
          NODE

      - name: Remove temporary audit Worker
        if: always()
        shell: bash
        run: |
          cd /tmp/auditorium-audit 2>/dev/null || exit 0
          npx --yes wrangler@4.127.1 delete --name movie-review-auditorium-asset-audit --config wrangler.jsonc --force || true
