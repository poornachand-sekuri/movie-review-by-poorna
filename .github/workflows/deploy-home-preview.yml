name: Deploy V3 Consolidation Preview

on:
  push:
    branches:
      - home-lounge-v3-redesign
      - v3-runtime-consolidation-20260902
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build static site
        run: npm run build

      - name: Deploy isolated Cloudflare temporary preview Worker
        run: npx wrangler deploy --temporary --config wrangler.preview.jsonc
