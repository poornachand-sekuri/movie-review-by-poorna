# Runtime QA waits for the same-SHA Cloudflare branch preview before testing.
# Human-tone gate: every live Popcorn Verdict and full review body must match compiled native source.
# Mobile master gate: phones use the same master renderer as desktop, with an opaque authoritative overlay layer that masks baked demo content.
name: Validate native preview runtime

on:
  push:
    branches: [wordpress-full-migration]
    paths:
      - 'migration/validate_preview_runtime.py'
      - 'public/index.html'
      - 'public/assets/app-v4.js'
      - 'public/assets/master-background.css'
      - 'public/assets/mobile-authoritative.css'
      - '.github/workflows/validate-preview-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read
  checks: read

jobs:
  runtime-qa:
    runs-on: ubuntu-latest
    env:
      PREVIEW_BASE: https://wordpress-full-migration-movie-review-by-poorna.poornarocks.workers.dev
    steps:
      - uses: actions/checkout@v4
      - name: Check browser JavaScript syntax
        run: |
          node --check public/assets/app-v4.js
          node --check public/assets/review-data-bridge.js
      - name: Wait for Cloudflare branch preview deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 30); do
            checks=$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs")
            status=$(jq -r '[.check_runs[] | select(.name == "Workers Builds: movie-review-by-poorna")][0].status // "missing"' <<<"${checks}")
            conclusion=$(jq -r '[.check_runs[] | select(.name == "Workers Builds: movie-review-by-poorna")][0].conclusion // ""' <<<"${checks}")
            echo "Cloudflare check: status=${status} conclusion=${conclusion:-pending}"
            if [ "${status}" = "completed" ] && [ "${conclusion}" = "success" ]; then
              sleep 3
              exit 0
            fi
            if [ "${status}" = "completed" ] && [ "${conclusion}" != "success" ]; then
              echo "Cloudflare preview deployment failed: ${conclusion}"
              exit 1
            fi
            sleep 5
          done
          echo "Cloudflare preview deployment did not complete within the QA polling window."
          exit 1
      - name: Verify authoritative mobile masking is deployed
        run: |
          html=$(curl -fsSL "${PREVIEW_BASE}/")
          grep -Fq '/assets/mobile-authoritative.css?v=2' <<<"${html}"
          css=$(curl -fsSL "${PREVIEW_BASE}/assets/mobile-authoritative.css?v=2")
          grep -Fq '.home-now-copy' <<<"${css}"
          grep -Fq '.home-recent-card{' <<<"${css}"
          grep -Fq '.home-prev-grid{' <<<"${css}"
          grep -Fq '.content-info{' <<<"${css}"
          grep -Fq '.content-review-body{' <<<"${css}"
          grep -Fq '.content-related-grid{' <<<"${css}"
      - name: Validate deployed Cloudflare preview runtime
        run: python migration/validate_preview_runtime.py
