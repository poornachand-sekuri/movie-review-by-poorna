name: Validate native cutover

on:
  push:
    branches: [wordpress-full-migration]
    paths:
      - 'src/**'
      - 'public/**'
      - 'migration/compiled/native-reviews.json'
      - 'migration/validate_native_cutover.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate native catalog and zero WordPress runtime
        run: python migration/validate_native_cutover.py
