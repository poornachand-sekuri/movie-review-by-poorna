name: Apply native review cutover

on:
  push:
    branches: [wordpress-full-migration]
    paths:
      - 'migration/apply_native_cutover.py'
      - '.github/workflows/apply-native-cutover.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cutover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate native public catalog and strip WordPress runtime
        run: python migration/apply_native_cutover.py
      - name: Validate generated native cutover
        run: python migration/validate_native_cutover.py
      - name: Check generated diff
        run: git diff --check
      - name: Commit native cutover
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A src/worker.js src/worker-v2.js public/data/index.json public/assets/app-v4.js public/assets/review-data-bridge.js public/assets/mobile-v2.js migration/compiled/cutover-report.json
          if git diff --cached --quiet; then
            echo 'Native cutover already applied.'
          else
            git commit -m 'Apply native review cutover'
            git push
          fi
