name: Apply Runtime Performance Cleanup Once

on:
  push:
    branches:
      - optimize/runtime-performance

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.head_commit.message == 'Seed runtime performance cleanup' ||
      github.event.head_commit.message == 'Fix runtime performance cleanup validation'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout performance branch
        uses: actions/checkout@v5
        with:
          ref: optimize/runtime-performance

      - name: Remove redundant content-page hydration work
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          app_path = Path('assets/js/app.js')
          app = app_path.read_text()
          start_marker = 'function reactionStorageKey(slug) {'
          end_marker = 'function renderMovie(movie) {'
          if start_marker not in app or end_marker not in app:
              raise SystemExit('Expected legacy reaction/comment block was not found in app.js')
          start = app.index(start_marker)
          end = app.index(end_marker, start)
          app = app[:start] + app[end:]

          old_render_tail = """  const content = $('#content');
            content.replaceChildren(fragment);
            setupReactions(content, movie);
            setupComments(content, movie);
            $('#app').setAttribute('aria-busy', 'false');
          """
          new_render_tail = """  const content = $('#content');
            content.replaceChildren(fragment);
            document.documentElement.dataset.activeReviewSlug = movie.s;
            $('#app').setAttribute('aria-busy', 'false');
          """
          if old_render_tail not in app:
              raise SystemExit('Expected renderMovie tail was not found in app.js')
          app = app.replace(old_render_tail, new_render_tail, 1)
          app_path.write_text(app)

          reactions_path = Path('assets/js/live-reactions.js')
          reactions = reactions_path.read_text()
          start_marker = 'async function resolveSlug() {'
          end_marker = '\nfunction normalize(values) {'
          if start_marker not in reactions or end_marker not in reactions:
              raise SystemExit('Expected resolveSlug block was not found in live-reactions.js')
          start = reactions.index(start_marker)
          end = reactions.index(end_marker, start)
          replacement = """function resolveSlug() {
            const url = new URL(location.href);
            const fromPage = document.documentElement.dataset.activeReviewSlug || null;
            const fromQuery = url.searchParams.get('review');
            const pathSlug = url.pathname.split('/').filter(Boolean).at(-1) || null;
            return fromPage || fromQuery || pathSlug;
          }
          """
          reactions = reactions[:start] + replacement + reactions[end:]
          reactions_path.write_text(reactions)

          comments_path = Path('assets/js/comments.js')
          comments = comments_path.read_text()
          start_marker = 'async function resolveReviewSlug() {'
          end_marker = '\nexport async function mountReviewComments() {'
          if start_marker not in comments or end_marker not in comments:
              raise SystemExit('Expected resolveReviewSlug block was not found in comments.js')
          start = comments.index(start_marker)
          end = comments.index(end_marker, start)
          replacement = """function resolveReviewSlug() {
            const url = new URL(location.href);
            const fromPage = document.documentElement.dataset.activeReviewSlug || null;
            const fromQuery = url.searchParams.get('review');
            const pathSlug = url.pathname.split('/').filter(Boolean).at(-1) || null;
            return fromPage || fromQuery || pathSlug;
          }
          """
          comments = comments[:start] + replacement + comments[end:]
          comments_path.write_text(comments)
          PY

      - name: Verify network cleanup invariants
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q "/data/index.json" assets/js/live-reactions.js
          ! grep -q "/data/index.json" assets/js/comments.js
          ! grep -q "setupReactions(content, movie)" assets/js/app.js
          ! grep -q "setupComments(content, movie)" assets/js/app.js
          grep -q "dataset.activeReviewSlug = movie.s" assets/js/app.js
          grep -q "dataset.activeReviewSlug" assets/js/live-reactions.js
          grep -q "dataset.activeReviewSlug" assets/js/comments.js

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Validate application and Worker
        run: npm run validate

      - name: Commit validated cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'poornachand-sekuri'
          git config user.email 'poornarocks@gmail.com'
          git add assets/js/app.js assets/js/live-reactions.js assets/js/comments.js
          git diff --cached --check
          git commit -m 'Remove redundant full-catalog hydration on review pages'
          git push origin HEAD:optimize/runtime-performance
