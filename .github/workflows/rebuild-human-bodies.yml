name: Apply human-tone editorial pass

on:
  push:
    branches: [wordpress-full-migration]
    paths:
      - 'migration/rebuild_human_bodies.py'
      - 'migration/apply_verdict_overrides.py'
      - 'migration/verdict-overrides.json'
      - '.github/workflows/rebuild-human-bodies.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore review bodies from original posts
        run: python migration/rebuild_human_bodies.py
      - name: Apply rewritten Popcorn Verdicts
        run: python migration/apply_verdict_overrides.py
      - name: Recompile native catalog
        run: python migration/compile_native_catalog.py
      - name: Validate diff
        run: git diff --check
      - name: Commit human-tone editorial pass
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add migration/edited migration/compiled/native-reviews.json migration/compiled/qa-report.json migration/compiled/human-body-rebuild-report.json migration/verdict-pass-status.json
          if git diff --cached --quiet; then
            echo 'Human-tone editorial pass already applied.'
          else
            git commit -m 'Apply human-tone review and verdict pass'
            git push
          fi
