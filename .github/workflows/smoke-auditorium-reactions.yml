name: Smoke Auditorium Reactions

on:
  push:
    branches:
      - cinema-rebuild
    paths:
      - '.github/auditorium-reactions-smoke.trigger'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify movie-specific reaction toggle
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://movie-review-by-poorna-preview.poornarocks.workers.dev'
          COOKIE_JAR="${RUNNER_TEMP}/reaction-cookies.txt"

          first="$(curl -fsS "${BASE}/api/reviews/dc/reactions")"
          list="$(curl -fsS "${BASE}/api/reviews?limit=12")"
          other_slug="$(node -e 'const x=JSON.parse(process.argv[1]); const rows=x.reviews||x.items||x; const r=rows.find(v=>v.slug!=="dc"); if(!r) process.exit(2); process.stdout.write(r.slug);' "$list")"
          other_before="$(curl -fsS "${BASE}/api/reviews/${other_slug}/reactions")"

          after_like="$(curl -fsS -c "$COOKIE_JAR" -b "$COOKIE_JAR" -X POST \
            -H 'content-type: application/json' \
            --data '{"reaction":"like"}' \
            "${BASE}/api/reviews/dc/reactions")"
          other_after="$(curl -fsS "${BASE}/api/reviews/${other_slug}/reactions")"
          restored="$(curl -fsS -c "$COOKIE_JAR" -b "$COOKIE_JAR" -X POST \
            -H 'content-type: application/json' \
            --data '{"reaction":"like"}' \
            "${BASE}/api/reviews/dc/reactions")"

          node - "$first" "$after_like" "$restored" "$other_before" "$other_after" <<'NODE'
          const [before, liked, restored, otherBefore, otherAfter] = process.argv.slice(2).map(JSON.parse);
          const okNumbers = value => Number.isInteger(value.likes) && Number.isInteger(value.dislikes);
          for (const value of [before, liked, restored, otherBefore, otherAfter]) {
            if (!okNumbers(value)) throw new Error('Reaction response is missing integer counts.');
          }
          if (liked.likes !== before.likes + 1) throw new Error('Like did not increment DC by exactly one.');
          if (liked.dislikes !== before.dislikes) throw new Error('Like unexpectedly changed DC dislikes.');
          if (liked.viewerReaction !== 'like') throw new Error('Viewer reaction was not marked as like.');
          if (restored.likes !== before.likes || restored.dislikes !== before.dislikes) {
            throw new Error('Second Like did not toggle the temporary vote off cleanly.');
          }
          if (restored.viewerReaction !== null) throw new Error('Viewer reaction did not clear after toggle-off.');
          if (otherAfter.likes !== otherBefore.likes || otherAfter.dislikes !== otherBefore.dislikes) {
            throw new Error('Reacting to DC changed another movie reaction totals.');
          }
          console.log(JSON.stringify({ before, liked, restored, otherBefore, otherAfter }, null, 2));
          NODE
