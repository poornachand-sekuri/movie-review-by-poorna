name: Smoke Validation Preview

on:
  push:
    branches:
      - optimization-preview
  workflow_dispatch:

jobs:
  smoke-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Verify validation Worker routes
        shell: bash
        run: |
          set -euo pipefail
          base='https://movie-review-by-poorna-validation.poornarocks.workers.dev'

          wait_for_route() {
            local path="$1"
            local expected_type="$2"
            local output="$3"
            local status='000'

            for attempt in {1..24}; do
              status=$(curl --connect-timeout 10 --max-time 45 \
                -sS -L -o "$output" -w '%{http_code}' "$base$path" || true)
              echo "Attempt $attempt: $path -> HTTP $status"
              if [ "$status" = '200' ]; then
                case "$expected_type" in
                  html)
                    if grep -qi '<!doctype html\|<html' "$output"; then return 0; fi
                    ;;
                  json)
                    if node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" "$output"; then return 0; fi
                    ;;
                esac
              fi
              sleep 5
            done

            echo "Validation route did not become ready: $path (last HTTP $status)"
            cat "$output" || true
            return 1
          }

          wait_for_route '/' html /tmp/home.html
          wait_for_route '/cine-cafe/' html /tmp/cine-cafe.html
          wait_for_route '/data/catalog.json' json /tmp/catalog.json

          node - /tmp/catalog.json <<'NODE'
          const fs = require('fs');
          const rows = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (!Array.isArray(rows) || rows.length < 100) {
            throw new Error(`Unexpected catalog size: ${Array.isArray(rows) ? rows.length : 'not-array'}`);
          }
          console.log(`Catalog records: ${rows.length}`);
          NODE

          echo "VALIDATION_URL=$base"
