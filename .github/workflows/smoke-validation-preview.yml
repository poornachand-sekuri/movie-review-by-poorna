name: Smoke Validation Preview

on:
  push:
    branches:
      - optimization-preview
  workflow_dispatch:

jobs:
  smoke-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Verify validation Worker routes
        shell: bash
        run: |
          set -euo pipefail
          base='https://movie-review-by-poorna-validation.poornarocks.workers.dev'

          probe() {
            local path="$1"
            local expected_type="$2"
            local output="$3"
            local status
            status=$(curl --retry 8 --retry-all-errors --retry-delay 3 \
              --connect-timeout 10 --max-time 45 \
              -sS -L -o "$output" -w '%{http_code}' "$base$path" || true)
            echo "$path -> HTTP $status"
            test "$status" = '200'
            case "$expected_type" in
              html) grep -qi '<!doctype html\|<html' "$output" ;;
              json) node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" "$output" ;;
            esac
          }

          probe '/' html /tmp/home.html
          probe '/cine-cafe/' html /tmp/cine-cafe.html
          probe '/data/catalog.json' json /tmp/catalog.json

          node - /tmp/catalog.json <<'NODE'
          const fs = require('fs');
          const rows = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (!Array.isArray(rows) || rows.length < 100) {
            throw new Error(`Unexpected catalog size: ${Array.isArray(rows) ? rows.length : 'not-array'}`);
          }
          console.log(`Catalog records: ${rows.length}`);
          NODE

          echo "VALIDATION_URL=$base"
