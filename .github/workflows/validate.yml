name: Validate Application

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate application
        run: npm run validate

      - name: Verify approved Now Reviewed uploads (read-only)
        run: node scripts/check-now-reviewed-artwork.mjs

      - name: Validate migration script syntax
        run: node --check scripts/build-legacy-seed.mjs

      - name: Audit all published production content pages (read-only)
        run: node scripts/audit-content.mjs https://moviereviewbypoorna.com

      - name: Build production application
        run: npm run build

      - name: Validate production Cloudflare bundle
        run: node scripts/cloudflare.mjs production dry-run

      - name: Build and validate preview Cloudflare bundle
        run: |
          npm run build:preview
          node scripts/cloudflare.mjs preview dry-run

      - name: Smoke-test all migrations and fixture importer
        run: node scripts/check-importer.mjs tests/fixtures/reviews.json tests/fixtures/cast-crew.json

      - name: Prove importer against preserved production catalogue
        shell: bash
        env:
          LEGACY_PRODUCTION_COMMIT: ab279f9d859561b6f642aee47d17d2875ade0911
        run: |
          set -euo pipefail

          git fetch --no-tags --depth=1 origin "$LEGACY_PRODUCTION_COMMIT"
          git show FETCH_HEAD:public/data/index.json > /tmp/legacy-reviews.json
          git show FETCH_HEAD:public/data/cast-crew.json > /tmp/legacy-credits.json

          node scripts/check-importer.mjs /tmp/legacy-reviews.json /tmp/legacy-credits.json
