name: Export Validated CI Optimization Files Once

on:
  push:
    branches:
      - optimize/code-workflow-files
    paths:
      - .github/workflows/export-validated-ci-files-once.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout optimization branch
        uses: actions/checkout@v4
        with:
          ref: optimize/code-workflow-files
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Recreate the validated file set
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          import re
          import textwrap

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          source = Path('.github/workflows/apply-ci-reproducibility-v2-once.yml').read_text(encoding='utf-8')
          match = re.search(
              r"          cat > scripts/smoke-local-mobile\.sh <<'EOF'\n(.*?)\n          EOF\n\n          python - <<'PY'",
              source,
              re.S
          )
          if not match:
              raise SystemExit('Unable to extract the reviewed mobile smoke script.')

          Path('scripts').mkdir(exist_ok=True)
          Path('scripts/smoke-local-mobile.sh').write_text(
              textwrap.dedent(match.group(1)).rstrip() + '\n',
              encoding='utf-8'
          )
          Path('.gitignore').write_text(
              'node_modules/\ndist/\n.wrangler/\n.dev.vars\nartifacts/\n',
              encoding='utf-8'
          )

          package_path = Path('package.json')
          package = json.loads(package_path.read_text(encoding='utf-8'))
          package['engines'] = {'node': '>=22 <23'}
          package['devDependencies']['wrangler'] = '4.127.1'
          package['scripts']['check:smoke'] = 'bash scripts/smoke-local-mobile.sh'
          package['scripts']['validate'] = 'npm run check:js && wrangler deploy --dry-run && npm run check:smoke'
          package_path.write_text(json.dumps(package, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          replace_once(
              '.github/workflows/validate-static.yml',
              "      - name: Set up Node\n        uses: actions/setup-node@v4\n        with:\n          node-version: '22'\n\n      - name: Install deployment tooling\n        run: npm install --no-audit --no-fund",
              "      - name: Set up Node\n        uses: actions/setup-node@v4\n        with:\n          node-version: '22'\n          cache: npm\n\n      - name: Install deployment tooling\n        run: npm ci --no-audit --no-fund"
          )

          run_id_expression = '${' + '{ github.run_id }}'
          replace_once(
              '.github/workflows/validate-static.yml',
              "          test -f src/worker.js\n          test -f src/worker-entry.js",
              "          test -f src/worker.js\n          test -f src/review-catalog.js\n          test -f src/worker-entry.js\n          test -f scripts/validate-compact-catalog.mjs\n          test -f scripts/smoke-local-mobile.sh\n          test -f package-lock.json\n\n      - name: Smoke-test rendered mobile pages locally\n        run: npm run check:smoke\n\n      - name: Upload mobile smoke evidence\n        if: always()\n        uses: actions/upload-artifact@v4\n        with:\n          name: mobile-smoke-" + run_id_expression + "\n          path: artifacts/mobile-smoke\n          if-no-files-found: warn\n          retention-days: 7"
          )

          replace_once(
              'docs/OPTIMIZATION-AUDIT.md',
              '- Expanded branch CI coverage to the optimization branch, restricted workflow permissions to read-only contents, added stale-run cancellation, a timeout, and lower-noise npm installation.\n',
              '- Expanded branch CI coverage to the optimization branch, restricted workflow permissions to read-only contents, added stale-run cancellation, a timeout, and lower-noise npm installation.\n- Added a committed npm lockfile, Node 22 engine constraint, `npm ci`, and dependency caching for reproducible and faster validation.\n- Upgraded and exactly pinned Wrangler to `4.127.1` so the local runtime supports the project compatibility date used by Cloudflare.\n- Added a local Cloudflare Worker plus headless-Chrome mobile smoke test for Home, Content, and Cine Cafe at 390×844, including endpoint payload checks and retained CI screenshot evidence.\n'
          )
          PY

      - name: Generate and install locked dependencies
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund

      - name: Revalidate the exact exported set
        run: |
          npm run check:js
          npx wrangler deploy --dry-run
          npm run check:smoke
          git diff --check

      - name: Package validated source files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export/.github/workflows export/scripts export/docs
          cp .gitignore package.json package-lock.json export/
          cp .github/workflows/validate-static.yml export/.github/workflows/
          cp scripts/smoke-local-mobile.sh export/scripts/
          cp docs/OPTIMIZATION-AUDIT.md export/docs/
          (cd export && sha256sum .gitignore package.json package-lock.json .github/workflows/validate-static.yml scripts/smoke-local-mobile.sh docs/OPTIMIZATION-AUDIT.md > SHA256SUMS)

      - name: Upload validated source files
        uses: actions/upload-artifact@v4
        with:
          name: validated-ci-files-${{ github.run_id }}
          path: export
          include-hidden-files: true
          retention-days: 2
