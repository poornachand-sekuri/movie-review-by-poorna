name: Smoke Moderated Comments

on:
  push:
    branches:
      - cinema-rebuild
    paths:
      - '.github/comments-smoke.trigger'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify pending-only submission and approved-only display
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://movie-review-by-poorna-preview.poornarocks.workers.dev'
          STAMP="${GITHUB_RUN_ID}-${RANDOM}"
          LOUNGE_BODY="MRP_COMMENT_SMOKE_LOUNGE_${STAMP}"
          DC_BODY="MRP_COMMENT_SMOKE_DC_${STAMP}"
          COOKIE_JAR="${RUNNER_TEMP}/comment-cookies.txt"

          cleanup() {
            npx wrangler d1 execute movie-review-by-poorna-content --remote --command \
              "DELETE FROM comments WHERE body IN ('$LOUNGE_BODY', '$DC_BODY');" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          lounge_post="$(curl -fsS -c "$COOKIE_JAR" -b "$COOKIE_JAR" -X POST \
            -H 'content-type: application/json' \
            --data "{\"target\":\"lounge\",\"target_id\":\"lounge\",\"name\":\"Smoke Tester\",\"comment\":\"$LOUNGE_BODY\"}" \
            "$BASE/api/comments")"

          dc_post="$(curl -fsS -c "$COOKIE_JAR" -b "$COOKIE_JAR" -X POST \
            -H 'content-type: application/json' \
            --data "{\"target\":\"review\",\"target_id\":\"dc\",\"name\":\"Smoke Tester\",\"comment\":\"$DC_BODY\"}" \
            "$BASE/api/comments")"

          lounge_pending="$(curl -fsS "$BASE/api/comments?target=lounge&target_id=lounge&limit=20")"
          dc_pending="$(curl -fsS "$BASE/api/comments?target=review&target_id=dc&limit=20")"
          kantara_pending="$(curl -fsS "$BASE/api/comments?target=review&target_id=kantara-chapter-1&limit=20")"

          node - "$lounge_post" "$dc_post" "$lounge_pending" "$dc_pending" "$kantara_pending" "$LOUNGE_BODY" "$DC_BODY" <<'NODE'
          const [loungePost, dcPost, loungePending, dcPending, kantaraPending] = process.argv.slice(2, 7).map(JSON.parse);
          const loungeBody = process.argv[7];
          const dcBody = process.argv[8];
          if (loungePost.status !== 'pending' || dcPost.status !== 'pending') throw new Error('Submitted comments were not marked pending.');
          const has = (payload, body) => Array.isArray(payload.comments) && payload.comments.some(c => c.comment === body);
          if (has(loungePending, loungeBody)) throw new Error('Pending Lounge comment leaked into public feed.');
          if (has(dcPending, dcBody)) throw new Error('Pending DC comment leaked into public feed.');
          if (has(kantaraPending, dcBody) || has(kantaraPending, loungeBody)) throw new Error('Pending comment leaked into another review thread.');
          NODE

          npx wrangler d1 execute movie-review-by-poorna-content --remote --command \
            "UPDATE comments SET status='approved', moderated_at=CURRENT_TIMESTAMP, approved_at=CURRENT_TIMESTAMP WHERE body='$DC_BODY';" >/tmp/approve.txt

          dc_approved="$(curl -fsS "$BASE/api/comments?target=review&target_id=dc&limit=20")"
          lounge_after="$(curl -fsS "$BASE/api/comments?target=lounge&target_id=lounge&limit=20")"
          kantara_after="$(curl -fsS "$BASE/api/comments?target=review&target_id=kantara-chapter-1&limit=20")"

          node - "$dc_approved" "$lounge_after" "$kantara_after" "$DC_BODY" "$LOUNGE_BODY" <<'NODE'
          const [dcApproved, loungeAfter, kantaraAfter] = process.argv.slice(2, 5).map(JSON.parse);
          const dcBody = process.argv[5];
          const loungeBody = process.argv[6];
          const has = (payload, body) => Array.isArray(payload.comments) && payload.comments.some(c => c.comment === body);
          if (!has(dcApproved, dcBody)) throw new Error('Approved DC comment did not appear in DC public feed.');
          if (has(loungeAfter, dcBody) || has(loungeAfter, loungeBody)) throw new Error('Review comment leaked into Lounge or pending Lounge comment became public.');
          if (has(kantaraAfter, dcBody)) throw new Error('Approved DC comment leaked into another review thread.');
          console.log('Moderated comments smoke test passed: pending hidden, approved visible, review isolation preserved.');
          NODE
