name: Audit original review voice source

on:
  push:
    branches: [wordpress-full-migration]
    paths:
      - 'migration/audit_human_source.py'
      - '.github/workflows/audit-human-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python migration/audit_human_source.py
      - name: Commit audit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add migration/compiled/human-source-audit.json
          if git diff --cached --quiet; then
            echo 'No audit changes.'
          else
            git commit -m 'Audit original review voice source'
            git push
          fi
