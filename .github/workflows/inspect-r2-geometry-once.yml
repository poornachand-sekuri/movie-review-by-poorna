name: Inspect Runtime Artwork Geometry Once

on:
  push:
    branches:
      - optimize/runtime-performance

permissions:
  contents: read

jobs:
  inspect-geometry:
    if: github.event.head_commit.message == 'Inspect runtime artwork geometry once'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Read production image dimensions in Chrome
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/geometry.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <body><main id="results"></main>
          <script>
          const urls = [
            'https://assets.moviereviewbypoorna.com/ui/pages/content/v2/mobile/01-top-logo-header-LOCKED.avif',
            'https://assets.moviereviewbypoorna.com/ui/pages/content/v2/mobile/03-clapboard-top-LOCKED.avif',
            'https://assets.moviereviewbypoorna.com/ui/pages/content/v2/mobile/04-clapboard-body-NO-SCREW-PLATE-LOCKED.avif',
            'https://assets.moviereviewbypoorna.com/ui/pages/content/v2/mobile/05-like-dislike-interaction-frame-TALLER-LOCKED.avif',
            'https://assets.moviereviewbypoorna.com/ui/pages/content/v2/mobile/06-poster-frame-LOCKED.avif',
            'https://assets.moviereviewbypoorna.com/ui/pages/content/v2/mobile/07-theater-top-LOCKED.avif?v=20260831-final-theater',
            'https://assets.moviereviewbypoorna.com/ui/pages/content/v2/mobile/08-theater-middle-stretchable-LOCKED.avif?v=20260831-final-theater',
            'https://assets.moviereviewbypoorna.com/ui/pages/content/v2/mobile/09-theater-bottom-seats-LOCKED.avif?v=20260831-final-theater',
            'https://assets.moviereviewbypoorna.com/ui/pages/content/v2/mobile/10-related-reviews-header-LOCKED.avif',
            'https://assets.moviereviewbypoorna.com/ui/pages/content/v2/mobile/11-related-reviews-film-reel-strip-LOCKED.avif',
            'https://assets.moviereviewbypoorna.com/ui/pages/content/v2/mobile/13-share-your-opinion-header-LOCKED.avif',
            'https://assets.moviereviewbypoorna.com/ui/pages/content/v2/mobile/14-comments-horizontal-shell-SPACING-PATCH-LOCKED.avif',
            'https://assets.moviereviewbypoorna.com/ui/pages/home/v2/mobile/luxury_movie_review_theatre_dashboard_MASTER_LOCKED.avif?v=20260901-master-v3',
            'https://assets.moviereviewbypoorna.com/ui/pages/cine-cafe/v2/mobile/Cine_Cafe_Master_2x3_BWR_Final.avif'
          ];
          Promise.all(urls.map(url => new Promise((resolve, reject) => {
            const image = new Image();
            image.onload = () => {
              const row = document.createElement('p');
              row.className = 'geometry';
              row.textContent = `${url} | ${image.naturalWidth}x${image.naturalHeight}`;
              document.querySelector('#results').append(row);
              resolve();
            };
            image.onerror = () => reject(new Error(`Could not load ${url}`));
            image.src = url;
          }))).then(() => {
            document.documentElement.dataset.complete = 'true';
          }).catch(error => {
            document.body.dataset.error = error.message;
          });
          </script>
          HTML

          google-chrome \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --virtual-time-budget=30000 \
            --dump-dom \
            file:///tmp/geometry.html > /tmp/geometry-output.html

          grep 'class="geometry"' /tmp/geometry-output.html
          grep -q 'data-complete="true"' /tmp/geometry-output.html
